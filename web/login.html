<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F3E3C8">
  <meta name="robots" content="noindex">
  <title>Sign in | Speak Up Fearless</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script>
    // Apply the saved theme before first paint; light is the default.
    try { if (localStorage.getItem('speakupfearless.theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (_) {}
  </script>
  <style>
    @font-face { font-family: "Montserrat"; src: url("/assets/assets/fonts/Montserrat-Variable.ttf") format("truetype"); font-weight: 100 900; font-display: swap; }
    @font-face { font-family: "Inter"; src: url("/assets/assets/fonts/Inter-Variable.ttf") format("truetype"); font-weight: 100 900; font-display: swap; }
    @font-face { font-family: "Cairo"; src: url("/assets/assets/fonts/Cairo-Variable.ttf") format("truetype"); font-weight: 200 1000; font-display: swap; }
    :root {
      --bg1: #F6E7CF; --bg2: #F8F5F1; --blob1: rgba(214,140,96,.38); --blob2: rgba(212,154,78,.30);
      --glass: rgba(255,255,255,.62); --glass-border: rgba(255,255,255,.75);
      --surface: #FFFFFF; --field: #FBF8F4;
      --ink: #2B2118; --text: #3A3029; --muted: #74695F; --border: #E8DED2;
      --primary: #B4583A; --primary-2: #C9773F; --on-primary: #FFFFFF;
      --soft: #F6E3D9; --error: #B42318; --ok: #3F7D4E;
      --shadow: 0 24px 60px -20px rgba(80,45,20,.28), 0 2px 6px rgba(80,45,20,.06);
    }
    :root[data-theme="dark"] {
      --bg1: #1D1612; --bg2: #14100D; --blob1: rgba(224,138,104,.22); --blob2: rgba(224,174,106,.14);
      --glass: rgba(34,27,22,.66); --glass-border: rgba(255,255,255,.07);
      --surface: #221B16; --field: #1A1410;
      --ink: #F2E9DF; --text: #E6DCD1; --muted: #B3A699; --border: #3A2F27;
      --primary: #D2724C; --primary-2: #D98A55; --on-primary: #FFF8F1;
      --soft: #3A2720; --error: #F97066; --ok: #7BC08C;
      --shadow: 0 24px 60px -20px rgba(0,0,0,.7), 0 2px 6px rgba(0,0,0,.3);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh; min-height: 100dvh;
      background: linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 55%);
      color: var(--text); overflow-x: hidden;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
    }
    :root[dir="rtl"] body, :root[dir="rtl"] h1, :root[dir="rtl"] h2 { font-family: "Cairo", "Inter", system-ui, sans-serif; }
    .blobs { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .blobs i { position: absolute; border-radius: 50%; filter: blur(60px); }
    .blobs i:nth-child(1) { width: 420px; height: 420px; background: var(--blob1); top: -140px; right: -120px; }
    .blobs i:nth-child(2) { width: 360px; height: 360px; background: var(--blob2); top: 240px; left: -180px; }
    .blobs::after { content: ""; position: absolute; inset: 0; opacity: .5;
      background-image: radial-gradient(rgba(120,80,50,.13) 1px, transparent 1px); background-size: 22px 22px;
      -webkit-mask-image: linear-gradient(180deg, #000 0%, transparent 60%); mask-image: linear-gradient(180deg, #000 0%, transparent 60%); }

    /* Header */
    header { position: sticky; top: 0; z-index: 5; padding: calc(env(safe-area-inset-top) + 10px) 14px 10px; }
    .bar {
      max-width: 1120px; margin: 0 auto; height: 56px; padding: 0 8px 0 14px;
      display: flex; align-items: center; gap: 4px;
      background: var(--glass); border: 1px solid var(--glass-border); border-radius: 999px;
      -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4);
      box-shadow: 0 8px 24px -12px rgba(80,45,20,.25);
    }
    :root[dir="rtl"] .bar { padding: 0 14px 0 8px; }
    .brand { display: flex; align-items: center; gap: 9px; text-decoration: none; color: var(--ink); min-width: 0; margin-inline-end: auto; }
    .brand svg { flex: none; }
    .brand span { font-family: "Montserrat", system-ui, sans-serif; font-weight: 800; font-size: 16px; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pill, .icon-btn {
      height: 40px; border: 0; border-radius: 999px; color: var(--ink); background: transparent;
      font: inherit; font-weight: 600; font-size: 14px; cursor: pointer; flex: none;
      display: inline-flex; align-items: center; justify-content: center; gap: 4px; text-decoration: none;
      transition: background .2s;
    }
    .pill { padding: 0 10px; }
    .icon-btn { width: 40px; }
    .pill:hover, .icon-btn:hover { background: var(--soft); }
    .pill svg { width: 18px; height: 18px; }
    .icon-btn svg { width: 21px; height: 21px; }

    /* Layout */
    main { position: relative; z-index: 1; max-width: 1120px; margin: 0 auto; padding: 18px 16px calc(env(safe-area-inset-bottom) + 40px); display: grid; gap: 28px; }
    .intro { padding: 8px 6px 0; animation: rise .6s ease both; }
    .eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--primary); }
    .eyebrow::before { content: ""; width: 22px; height: 2px; border-radius: 2px; background: currentColor; }
    h1 { font-family: "Montserrat", system-ui, sans-serif; color: var(--ink); font-weight: 800; letter-spacing: -.02em;
      font-size: clamp(30px, 8.6vw, 54px); line-height: 1.08; margin: 12px 0 10px; }
    h1 em { font-style: normal; background: linear-gradient(90deg, var(--primary), var(--primary-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .lead { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.55; max-width: 460px; }
    .perks { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 0; padding: 0; list-style: none; }
    .perks li { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; background: var(--glass); border: 1px solid var(--glass-border); font-size: 13px; font-weight: 600; color: var(--ink); }
    .perks svg { width: 15px; height: 15px; color: var(--primary); }
    .photo { display: none; }

    /* Card */
    .card { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: 28px; padding: 8px 22px 26px; box-shadow: var(--shadow); animation: rise .6s .08s ease both; }
    .tabs { position: relative; display: grid; grid-template-columns: 1fr 1fr; padding: 5px; margin: 14px 0 22px; background: var(--field); border: 1px solid var(--border); border-radius: 999px; }
    .tabs button { position: relative; z-index: 1; height: 42px; border: 0; background: none; font: inherit; font-weight: 700; font-size: 14px; color: var(--muted); cursor: pointer; border-radius: 999px; transition: color .25s; }
    .tabs button[aria-selected="true"] { color: var(--on-primary); }
    .tabs .thumb { position: absolute; top: 5px; bottom: 5px; width: calc(50% - 5px); inset-inline-start: 5px; border-radius: 999px;
      background: linear-gradient(135deg, var(--primary), var(--primary-2)); box-shadow: 0 6px 16px -6px var(--primary); transition: transform .3s cubic-bezier(.3,.7,.2,1); }
    :root[dir="ltr"] .tabs[data-mode="signup"] .thumb { transform: translateX(100%); }
    :root[dir="rtl"] .tabs[data-mode="signup"] .thumb { transform: translateX(-100%); }
    h2 { font-family: "Montserrat", system-ui, sans-serif; color: var(--ink); font-size: 22px; font-weight: 800; margin: 0 0 4px; letter-spacing: -.01em; }
    p.sub { margin: 0 0 20px; color: var(--muted); font-size: 14.5px; line-height: 1.5; }

    .btn { width: 100%; min-height: 52px; border-radius: 16px; font: inherit; font-weight: 700; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: transform .15s, box-shadow .2s, border-color .2s, filter .2s; }
    .btn:active { transform: scale(.985); }
    .btn-google { background: var(--surface); color: var(--ink); border: 1.5px solid var(--border); }
    .btn-google:hover { border-color: var(--muted); }
    .btn-primary { margin-top: 22px; border: 0; color: var(--on-primary); background: linear-gradient(135deg, var(--primary), var(--primary-2)); box-shadow: 0 12px 24px -10px var(--primary); }
    .btn-primary:hover { filter: brightness(1.05); box-shadow: 0 16px 28px -10px var(--primary); }
    .btn-primary svg { width: 18px; height: 18px; transition: transform .2s; }
    .btn-primary:hover svg { transform: translateX(3px); }
    :root[dir="rtl"] .btn-primary svg { transform: scaleX(-1); }
    .btn[disabled] { opacity: .6; cursor: wait; }
    .or { display: flex; align-items: center; gap: 12px; color: var(--muted); margin: 20px 0 4px; font-size: 12.5px; }
    .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--border); }

    label { display: block; color: var(--ink); font-weight: 600; font-size: 13.5px; margin: 14px 0 6px; }
    .field { position: relative; }
    .field > svg { position: absolute; top: 50%; inset-inline-start: 14px; width: 19px; height: 19px; transform: translateY(-50%); color: var(--muted); pointer-events: none; transition: color .2s; }
    input { width: 100%; height: 52px; background: var(--field); color: var(--ink); border: 1.5px solid var(--border); border-radius: 16px; padding: 0 14px 0 44px; font: inherit; font-size: 16px; transition: border-color .2s, box-shadow .2s, background .2s; }
    :root[dir="rtl"] input { padding: 0 44px 0 14px; }
    input::placeholder { color: var(--muted); opacity: .7; }
    input:focus { outline: none; border-color: var(--primary); background: var(--surface); box-shadow: 0 0 0 4px color-mix(in srgb, var(--primary) 18%, transparent); }
    .field:focus-within > svg { color: var(--primary); }
    .peek { position: absolute; top: 50%; inset-inline-end: 6px; transform: translateY(-50%); width: 40px; height: 40px; border: 0; background: none; color: var(--muted); border-radius: 12px; cursor: pointer; display: grid; place-items: center; }
    .peek:hover { color: var(--ink); }
    .peek svg { width: 20px; height: 20px; }
    #password { padding-inline-end: 50px; }

    .forgot-row { display: flex; justify-content: flex-end; margin-top: 10px; }
    .link { background: none; border: 0; padding: 4px 0; font: inherit; font-size: 13.5px; color: var(--primary); font-weight: 700; cursor: pointer; }
    .link:hover { text-decoration: underline; text-underline-offset: 3px; }
    .msg { margin-top: 14px; font-size: 14px; text-align: center; padding: 10px 12px; border-radius: 12px; }
    .msg:empty { display: none; }
    .msg.error { color: var(--error); background: color-mix(in srgb, var(--error) 10%, transparent); }
    .msg.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); }
    .trust { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 18px 0 0; font-size: 12.5px; color: var(--muted); text-align: center; }
    .trust svg { width: 15px; height: 15px; flex: none; color: var(--ok); }
    .hidden { display: none !important; }
    /* Email code */
    .verify { text-align: center; padding-top: 18px; }
    .v-ic { width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 20px; display: grid; place-items: center; background: var(--soft); color: var(--primary); }
    .v-ic svg { width: 30px; height: 30px; }
    .verify .sub b { display: block; color: var(--ink); overflow-wrap: anywhere; }
    .code { position: relative; margin: 6px auto 0; max-width: 330px; }
    .code input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; font-size: 16px; padding: 0; border: 0; caret-color: transparent; }
    .slots { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; pointer-events: none; }
    .slots i { height: 58px; border: 1.5px solid var(--border); border-radius: 14px; background: var(--field); display: grid; place-items: center; font-style: normal; font-family: "Montserrat", sans-serif; font-weight: 800; font-size: 26px; color: var(--ink); transition: border-color .15s, box-shadow .15s; }
    .slots i.on { border-color: var(--primary); box-shadow: 0 0 0 4px color-mix(in srgb, var(--primary) 18%, transparent); }
    .code.bad .slots i { border-color: var(--error); animation: vshake .4s; }
    .code.good .slots i { border-color: var(--ok); }
    @keyframes vshake { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-2px); } 80% { transform: translateX(2px); } }
    .v-how { margin: 0 auto 14px; max-width: 340px; color: var(--muted); font-size: 14px; }
    .v-links { display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; margin-top: 14px; }
    .link[disabled] { color: var(--muted); cursor: default; text-decoration: none; }
    #vSkip { margin-top: 14px; }

    main > * { min-width: 0; }
    .saved { margin: 0 0 18px; }
    .saved-label { margin: 0 0 8px; font-size: 13px; font-weight: 700; color: var(--muted); }
    .acct { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; margin-bottom: 8px; border: 1.5px solid var(--border); border-radius: 16px; background: var(--field); color: var(--ink); font: inherit; text-align: start; cursor: pointer; transition: border-color .15s; }
    .acct:hover { border-color: var(--primary); }
    .acct .av { width: 40px; height: 40px; border-radius: 50%; flex: none; display: grid; place-items: center; background: var(--primary); color: var(--on-primary); font-weight: 800; font-size: 16px; }
    .acct .who { flex: 1; min-width: 0; }
    .acct .who b { display: block; font-size: 15px; }
    .acct .who small { display: block; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .acct .x { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); flex: none; }
    .acct .x:hover { background: var(--soft); color: var(--ink); }
    .acct .x svg { width: 16px; height: 16px; }

    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

    @media (max-width: 420px) { .brand span { font-size: 15px; } }
    /* On phones the form comes first; the intro would push it below the fold. */
    @media (max-width: 600px) {
      .intro .eyebrow, .intro h1, .intro .lead { display: none; }
      .intro { order: 2; padding-top: 0; }
      .perks { justify-content: center; margin-top: 0; }
      main { padding-top: 8px; gap: 16px; }
    }
    @media (max-width: 380px) { .card { padding: 6px 16px 22px; } .pill { padding: 0 8px; } .icon-btn { width: 36px; } }
    @media (min-width: 920px) {
      main { grid-template-columns: 1.05fr .95fr; align-items: center; gap: 64px; padding-top: 48px; min-height: calc(100vh - 90px); }
      .intro { padding: 0; }
      .photo { display: block; position: relative; margin: 30px 0 0; max-width: 460px; aspect-ratio: 16 / 10; border-radius: 24px; overflow: hidden; box-shadow: var(--shadow); }
      .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .photo figcaption { position: absolute; inset-inline: 14px; bottom: 14px; padding: 12px 14px; border-radius: 16px; background: rgba(30,22,16,.62); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); color: #F7EEE4; font-size: 14px; line-height: 1.45; }
      .photo figcaption b { display: block; font-size: 12px; font-weight: 600; color: #E9C9B5; margin-top: 4px; }
      .card { padding: 10px 34px 34px; max-width: 460px; justify-self: end; width: 100%; }
    }
    .try-free { grid-column: 1 / -1; justify-self: center; display: inline-flex; align-items: center; gap: 8px; padding: 12px 18px; border-radius: 999px; background: color-mix(in srgb, var(--primary) 12%, transparent); color: var(--primary); font-weight: 700; font-size: 15px; text-align: center; text-decoration: none; }
    .try-free .fl { font-size: 18px; }
  </style>
</head>
<body>
  <div class="blobs" aria-hidden="true"><i></i><i></i></div>
  <header>
    <div class="bar">
      <a class="brand" href="/" aria-label="Speak Up Fearless">
        <svg width="30" height="30" viewBox="0 0 100 100" aria-hidden="true">
          <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--primary)"/><stop offset="1" stop-color="var(--primary-2)"/></linearGradient></defs>
          <rect x="8" y="8" width="84" height="64" rx="22" fill="url(#lg)"/>
          <path d="M28 68 L22 92 L48 68 Z" fill="var(--primary)"/>
          <path d="M38 48 L50 28 L62 48 M50 28 L50 56" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span dir="ltr">Speak Up Fearless</span>
      </a>
      <button class="pill" id="lang" type="button"></button>
      <button class="icon-btn" id="theme" type="button"></button>
      <a class="icon-btn" id="home" href="/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg>
      </a>
    </div>
  </header>

  <main>
    <section class="intro">
      <span class="eyebrow" id="eyebrow"></span>
      <h1 id="headline"></h1>
      <p class="lead" id="lead"></p>
      <ul class="perks">
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 11h4M8 9v4M15 12h.01M18 10h.01"/><rect x="2" y="6" width="20" height="12" rx="6"/></svg><span id="perk1"></span></li>
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/></svg><span id="perk2"></span></li>
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/></svg><span id="perk3"></span></li>
      </ul>
      <figure class="photo">
        <img src="/assets/assets/images/playing-a-game-pic.jpeg" alt="" loading="lazy">
        <figcaption><span id="photoCaption"></span></figcaption>
      </figure>
    </section>

    <section class="card">
      <div class="tabs" id="tabs" role="tablist">
        <span class="thumb" aria-hidden="true"></span>
        <button id="tabIn" role="tab" type="button"></button>
        <button id="tabUp" role="tab" type="button"></button>
      </div>
      <h2 id="title"></h2>
      <p class="sub" id="subtitle"></p>

      <div class="saved hidden" id="saved">
        <p class="saved-label" id="savedLabel"></p>
        <div id="savedList"></div>
      </div>

      <button class="btn btn-google" id="google" type="button">
        <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        <span id="googleLabel"></span>
      </button>

      <div class="or" id="or"></div>

      <!-- A real sign-in form (method, action, names, autocomplete) so the phone's
           password manager offers to save and fill the email and password. -->
      <form id="form" method="post" action="/login" autocomplete="on" novalidate>
        <div id="nameRow" class="hidden">
          <label for="name" id="nameLabel"></label>
          <div class="field">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
            <input id="name" name="name" autocomplete="name">
          </div>
        </div>
        <label for="email" id="emailLabel"></label>
        <div class="field">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg>
          <input id="email" name="email" type="email" autocomplete="username" inputmode="email" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="you@example.com" required>
        </div>
        <label for="password" id="passwordLabel"></label>

        const body = { timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone || '' };
        if (name) { body.displayName = name; body.language = lang; }
        await fetch(API_BASE + '/v1/me', { method: 'PATCH', headers, signal: ctl.signal, body: JSON.stringify(body) });
        clearTimeout(timer);
      } catch (_) {}
    }

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    // localStorage lets the main site read who is signed in.
    await setPersistence(auth, browserLocalPersistence);

    $('form').removeEventListener('submit', early);
    setBusy(false);
    show('');

    // Already signed in on this device: one tap to carry on.
    await auth.authStateReady();
    if (auth.currentUser && !params.has('signout')) {
      signedInEmail = auth.currentUser.email;
      saveAccount(auth.currentUser, savedAccounts().find((a) => a.email === signedInEmail)?.method || 'email');
    }
    const last = savedAccounts()[0];
    if (last && !$('email').value) $('email').value = last.email;
    renderSaved();
    const renderBase = render;
    render = function () { renderBase(); renderSaved(); };

    if (params.has('signout')) {
      await signOut(auth);
      location.replace(next);
    }


    // ---------------------------------------------------------------- email code
    // Email sign-ups confirm their address with a 6-digit code before playing.
    const SKIP_KEY = (uid) => 'speakupfearless.verifySkip.' + uid;
    let cooldownTimer = null;
    async function api(path, opts) {
      const token = await auth.currentUser.getIdToken();
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), 12000);
      try {
        const r = await fetch(API_BASE + path, Object.assign({ signal: ctl.signal }, opts, {
          headers: Object.assign({ Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' }, (opts || {}).headers),
        }));
        let body = {};
        try { body = await r.json(); } catch (_) {}
        return { status: r.status, body };
      } finally { clearTimeout(timer); }
    }
    async function isVerified(user) {
      if (user.emailVerified) return true;
      try {
        const r = await api('/v1/me');
        return r.status === 200 ? r.body.emailVerified !== false : true;
      } catch (_) { return true; }  // Never lock people out if the API is down.
    }
    function vShow(text, kind) { $('vMsg').textContent = text || ''; $('vMsg').className = 'msg ' + (kind || ''); }
    function slots() {
      const v = $('code').value.replace(/\D/g, '').slice(0, 6);
      $('code').value = v;
      const items = $('codeBoxes').querySelectorAll('.slots i');
      items.forEach((el, i) => { el.textContent = v[i] || ''; el.classList.toggle('on', document.activeElement === $('code') && i === Math.min(v.length, 5)); });
      $('codeBoxes').classList.remove('bad');
      if (v.length === 6) $('vForm').requestSubmit();
    }
    function cooldown(seconds) {
      clearInterval(cooldownTimer);
      let left = seconds;
      const tick = () => {
        $('vResend').disabled = left > 0;
        $('vResend').textContent = left > 0 ? ui().vResendIn.replace('{s}', left) : ui().vResend;
        if (left-- <= 0) clearInterval(cooldownTimer);
      };
      tick();
      cooldownTimer = setInterval(tick, 1000);
    }
    // One request at a time, and no automatic resend while the last code is fresh.
    let sending = false;
    const sentKey = () => 'speakupfearless.codeSentAt.' + (auth.currentUser ? auth.currentUser.uid : '');
    function sentAgo() {
      try { return (Date.now() - Number(localStorage.getItem(sentKey()) || 0)) / 1000; } catch (_) { return Infinity; }
    }
    async function sendCode(quiet) {
      if (sending) return;
      if (quiet && sentAgo() < 60) { vShow(ui().vAlready, 'ok'); cooldown(Math.ceil(60 - sentAgo())); return; }
      sending = true;
      try {
        const r = await api('/v1/me/verify/send', { method: 'POST', body: '{}' });
        if (r.body.verified) { finishVerified(); return; }
        if (r.status === 200) {
          try { localStorage.setItem(sentKey(), String(Date.now())); } catch (_) {}
          if (!quiet) vShow(ui().vSent, 'ok');
          cooldown(60);
          return;
        }
        if (r.status === 429) {
          const wait = Math.max(1, Math.ceil(r.body.retryAfter || 60));
          // Opening the screen right after a code went out: that code is still good.
          if (quiet) { vShow(ui().vAlready, 'ok'); cooldown(wait); return; }
          waitMessage(wait);
          cooldown(wait);
          return;
        }
        if (r.status === 503) { offline(); return; }
        vShow(ui().vFail, 'error'); cooldown(15);
      } catch (_) { vShow(ui().vFail, 'error'); cooldown(15); }
      finally { sending = false; }
    }
    // "Please wait 44 seconds…", counting down, then cleared.
    let waitTimer = null;
    function waitMessage(seconds) {
      clearInterval(waitTimer);
      let left = seconds;
      const paint = () => {
        if (left <= 0) { clearInterval(waitTimer); vShow(''); return; }
        vShow(ui().vWait.replace('{s}', left), 'error');
        left--;
      };
      paint();
      waitTimer = setInterval(paint, 1000);
    }
    function offline() {
      // Codes aren't switched on yet: let people carry on instead of getting stuck.
      try { localStorage.setItem(SKIP_KEY(auth.currentUser.uid), '1'); } catch (_) {}
      vShow(ui().vOff);
      $('vSub').parentNode.classList.add('hidden');
      $('vSkip').classList.remove('hidden');
      $('vForm').classList.add('hidden');
      $('vResend').classList.add('hidden');
    }
    // Confirmed (by code, by the email's button, or on another device):
    // refresh the sign-in so it carries the change, then carry on.
    let finished = false, pollTimer = null;
    async function finishVerified() {
      if (finished) return;
      finished = true;
      clearInterval(pollTimer);
      $('codeBoxes').classList.add('good');
      vShow(ui().vDone, 'ok');
      try { await auth.currentUser.getIdToken(true); } catch (_) {}
      setTimeout(done, 600);
    }
    // Someone may tap "Verify my email" on their phone while this screen is
    // open on a laptop: check now and then and move on once it's confirmed.
    async function pollVerified() {
      if (finished || document.hidden || !auth.currentUser) return;
      try {
        const r = await api('/v1/me');
        if (r.status === 200 && r.body.emailVerified === true) finishVerified();
      } catch (_) {}
    }
    let verifyShown = false;
    function showVerify(noSend) {
      if (verifyShown) return;
      verifyShown = true;
      const t = ui();
      for (const id of ['tabs', 'title', 'subtitle', 'saved', 'google', 'or', 'form', 'msg']) $(id).classList.add('hidden');
      $('verify').classList.remove('hidden');
      $('vTitle').textContent = t.vTitle;
      $('vSub').textContent = t.vSub;
      $('vEmail').textContent = auth.currentUser.email || '';
      $('vSubmitLabel').textContent = t.vSubmit;
      $('vChange').textContent = t.vChange;
      $('vSkip').textContent = t.vSkip;
      $('vHow').textContent = t.vHow;
      $('code').value = '';
      $('code').focus({ preventScroll: true });
      slots();
      setTimeout(() => { if (document.activeElement !== $('code')) $('code').focus({ preventScroll: true }); }, 60);
      if (!noSend) sendCode(true);
      pollTimer = setInterval(pollVerified, 5000);
      document.addEventListener('visibilitychange', pollVerified);
    }
    async function afterSignIn(user) {
      if (await isVerified(user)) { done(); return; }
      setBusy(false);
      showVerify();
    }
    $('code').addEventListener('input', slots);
    $('code').addEventListener('focus', slots);
    $('code').addEventListener('blur', slots);
    $('vForm').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const code = $('code').value;
      if (code.length !== 6) { vShow(ui().vNeed6, 'error'); return; }
      $('vSubmit').disabled = true;
      try {
        const r = await api('/v1/me/verify/check', { method: 'POST', body: JSON.stringify({ code }) });
        if (r.body.verified) { finishVerified(); return; }
        $('codeBoxes').classList.add('bad');
        if (r.body.error === 'expired') { vShow(ui().vExpired, 'error'); $('code').value = ''; try { localStorage.removeItem(sentKey()); } catch (_) {} sendCode(true); }
        else if (r.status === 503) offline();
        else if (r.body.error === 'wrong') vShow(ui().vWrong.replace('{n}', r.body.attemptsLeft ?? ''), 'error');
        else if (r.status === 429) { waitMessage(Math.ceil(r.body.retryAfter || 60)); }
        else vShow(ui().vFail, 'error');
      } catch (_) { vShow(ui().vFail, 'error'); }
      finally { $('vSubmit').disabled = false; }
    });
    $('vResend').addEventListener('click', () => sendCode(false));
    $('vSkip').addEventListener('click', done);
    $('vChange').addEventListener('click', async () => {
      await signOut(auth);
      location.replace('/login?mode=signup&next=' + encodeURIComponent(next));
    });

    // ?verify=verified|wrong|expired: back from the button in the code email.
    // ?verify=1: opened from a game, signed in but not confirmed yet.
    const verifyParam = params.get('verify');
    if (verifyParam === 'verified') {
      if (auth.currentUser) { showVerify(true); finishVerified(); }
      else show(ui().vLinkOk, 'ok');
    } else if (verifyParam === 'wrong' || verifyParam === 'expired') {
      if (auth.currentUser) { vShow(ui().vLinkNew, 'error'); showVerify(); }
      else show(ui().vLinkBad, 'error');
    } else if (verifyParam !== null && auth.currentUser) {
      showVerify();
    }

    async function googleDone(cred) {
      saveAccount(cred.user, 'google');
      await syncAccount(cred.user);
      done();
    }
    // Back from Google after a same-tab sign-in.
    if (SAME_TAB_GOOGLE) {
      getRedirectResult(auth).then((cred) => { if (cred) { setBusy(true); return googleDone(cred); } }).catch(fail);
    }

    $('google').addEventListener('click', async () => {
      setBusy(true);
      try {
        if (SAME_TAB_GOOGLE && POPUP_UNSAFE) {
          // Leaves for Google and comes back to this same page.
          await signInWithRedirect(auth, new GoogleAuthProvider());
          return;
        }
        // Firebase only notices a closed Google window after several seconds.
        // When the page gets focus back and no answer arrives shortly after,
        // free the page straight away. A late success still signs them in.
        let settled = false, released = false, timer = null;
        const back = () => {
          if (settled || document.visibilityState === 'hidden') return;
          clearTimeout(timer);
          timer = setTimeout(() => {
            if (settled) return;
            released = true;
            setBusy(false);
            show(ui().errors['auth/popup-closed-by-user'], 'error');
          }, 1200);
        };
        window.addEventListener('focus', back);
        document.addEventListener('visibilitychange', back);
        try {
          const cred = await signInWithPopup(auth, new GoogleAuthProvider());
          settled = true;
          setBusy(true);
          show('');
          await googleDone(cred);
        } catch (e) {
          settled = true;
          if (!(released && e && (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request'))) fail(e);
        } finally {
          clearTimeout(timer);
          window.removeEventListener('focus', back);
          document.removeEventListener('visibilitychange', back);
        }
      } catch (e) { fail(e); }
    });

    // iPhones only open the keyboard for a focus inside the tap itself, and
    // the code screen shows up after sign-up finishes. So the tap focuses a
    // hidden number field right away, and focus moves to the code boxes once
    // they appear: the keyboard stays open the whole time.
    function holdKeyboard() {
      let el = $('kbHold');
      if (!el) {
        el = document.createElement('input');
        el.id = 'kbHold';
        el.setAttribute('inputmode', 'numeric');
        el.setAttribute('aria-hidden', 'true');
        el.tabIndex = -1;
        el.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px;border:0;padding:0;pointer-events:none;';
        document.body.appendChild(el);
      }
      el.focus({ preventScroll: true });
    }
    function releaseKeyboard() { const el = $('kbHold'); if (el && document.activeElement === el) el.blur(); }
    $('form').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      if (mode === 'signup') holdKeyboard();
      const email = $('email').value.trim();
      const password = $('password').value;
      setBusy(true);
      try {
        if (mode === 'signup') {
          const cred = await withTimeout(createUserWithEmailAndPassword(auth, email, password), 25000);
          const name = $('name').value.trim();
          if (name) await updateProfile(cred.user, { displayName: name });
          // Store the updated profile so the site sees the name.
          await auth.updateCurrentUser(cred.user);
          await syncAccount(cred.user, name);
          saveAccount({ email, displayName: name }, 'email');
          await rememberLogin(email, password, name);
          setBusy(false);
          showVerify();
          return;
        } else {
          const cred = await withTimeout(signInWithEmailAndPassword(auth, email, password), 25000);
          await syncAccount(cred.user);
          saveAccount(cred.user, 'email');
          await rememberLogin(email, password);
          await afterSignIn(cred.user);
          return;
        }
      } catch (e) { fail(e); }
    });

    $('forgot').addEventListener('click', async () => {
      const email = $('email').value.trim();
      if (!email) { show(ui().needEmail, 'error'); return; }
      try { await sendPasswordResetEmail(auth, email); show(ui().resetSent, 'ok'); } catch (e) { fail(e); }
    });
  </script>
</body>
</html>
