<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FFD27F">
  <meta name="robots" content="noindex">
  <title>Sign in | Speak Up Fearless</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    :root {
      --band: #FFD27F; --page: #F7F5F2; --ink: #2B2118; --muted: #6B6259;
      --primary: #C2410C; --primary-dark: #9A3412; --soft: #FFEDD5;
      --border: #E7E1DA; --error: #B42318;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--page); color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Cairo", "Noto Sans Arabic", sans-serif; }
    header { background: var(--band); padding: 18px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    header a { color: var(--ink); text-decoration: none; font-weight: 700; font-size: 18px; }
    header button { background: rgba(255,255,255,.55); border: 0; border-radius: 999px; padding: 8px 14px; font: inherit; font-weight: 600; color: var(--ink); cursor: pointer; }
    main { max-width: 440px; margin: 40px auto; padding: 0 16px 48px; }
    .card { background: #fff; border-radius: 24px; padding: 28px; box-shadow: 0 10px 20px rgba(43,33,24,.12); }
    h1 { font-size: 26px; margin: 0 0 6px; }
    p.sub { margin: 0 0 22px; color: var(--muted); }
    .btn { width: 100%; min-height: 50px; border-radius: 999px; font: inherit; font-weight: 700; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .btn-google { background: #fff; color: var(--ink); border: 1.5px solid var(--border); }
    .btn-google:hover { border-color: var(--ink); }
    .btn-primary { background: var(--primary); color: #fff; border: 0; margin-top: 6px; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn[disabled] { opacity: .6; cursor: wait; }
    .or { display: flex; align-items: center; gap: 12px; color: var(--muted); margin: 20px 0; font-size: 14px; }
    .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--border); }
    label { display: block; font-weight: 600; font-size: 14px; margin: 12px 0 6px; }
    input { width: 100%; min-height: 48px; border: 1px solid var(--border); border-radius: 12px; padding: 0 14px; font: inherit; font-size: 16px; }
    input:focus { outline: 2px solid var(--primary); border-color: transparent; }
    .links { display: flex; justify-content: space-between; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
    .link { background: none; border: 0; padding: 4px 0; font: inherit; color: var(--primary-dark); font-weight: 600; cursor: pointer; }
    .msg { margin-top: 14px; font-size: 14px; min-height: 20px; }
    .msg.error { color: var(--error); }
    .msg.ok { color: #166534; }
    .note { margin-top: 18px; font-size: 13px; color: var(--muted); text-align: center; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <header>
    <a href="/" data-i18n="brand">Speak Up Fearless</a>
    <button id="lang" type="button"></button>
  </header>
  <main>
    <div class="card">
      <h1 id="title"></h1>
      <p class="sub" id="subtitle"></p>

      <button class="btn btn-google" id="google" type="button">
        <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        <span id="googleLabel"></span>
      </button>

      <div class="or" id="or"></div>

      <form id="form" novalidate>
        <div id="nameRow" class="hidden">
          <label for="name" id="nameLabel"></label>
          <input id="name" autocomplete="name">
        </div>
        <label for="email" id="emailLabel"></label>
        <input id="email" type="email" autocomplete="email" required>
        <label for="password" id="passwordLabel"></label>
        <input id="password" type="password" autocomplete="current-password" required minlength="6">
        <button class="btn btn-primary" id="submit" type="submit"></button>
      </form>

      <div class="links">
        <button class="link" id="switchMode" type="button"></button>
        <button class="link" id="forgot" type="button"></button>
      </div>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>
      <p class="note" id="note"></p>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js';
    import {
      getAuth, setPersistence, browserLocalPersistence, GoogleAuthProvider,
      signInWithPopup, signInWithEmailAndPassword, createUserWithEmailAndPassword,
      updateProfile, sendPasswordResetEmail, signOut,
    } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js';

    // Public web config for the Speak Up Fearless Firebase project.
    const firebaseConfig = {
      apiKey: 'AIzaSyD61GC3xaetEqOwPYhYltxMp-FAsFLX6Ow',
      authDomain: 'speakup-ca500.firebaseapp.com',
      projectId: 'speakup-ca500',
      storageBucket: 'speakup-ca500.firebasestorage.app',
      messagingSenderId: '228155483447',
      appId: '1:228155483447:web:6c6ef4cc6f9454f7d8e6b2',
    };

    const T = {
      en: {
        brand: 'Speak Up Fearless', lang: 'العربية',
        signInTitle: 'Welcome back', signInSub: 'Sign in to keep track of your practice.',
        signUpTitle: 'Create your account', signUpSub: 'Free. Save your game history and progress.',
        google: 'Continue with Google', or: 'or',
        name: 'Your name', email: 'Email', password: 'Password (6+ characters)',
        signIn: 'Sign in', signUp: 'Create account',
        toSignUp: 'New here? Create an account', toSignIn: 'Have an account? Sign in',
        forgot: 'Forgot password?', resetSent: 'Check your email for a reset link.',
        needEmail: 'Enter your email first.', working: 'One moment…',
        note: 'You can play all games without an account.',
        errors: {
          'auth/invalid-credential': 'That email and password don’t match.',
          'auth/invalid-email': 'Please enter a valid email.',
          'auth/email-already-in-use': 'That email already has an account. Try signing in.',
          'auth/weak-password': 'Please use at least 6 characters.',
          'auth/popup-closed-by-user': 'The Google window was closed. Try again.',
          'auth/popup-blocked': 'Your browser blocked the Google window. Allow pop-ups and try again.',
          'auth/unauthorized-domain': 'Sign-in isn’t enabled for this web address yet.',
          'auth/too-many-requests': 'Too many tries. Please wait a moment.',
          default: 'Something went wrong. Please try again.',
        },
      },
      ar: {
        brand: 'Speak Up Fearless', lang: 'English',
        signInTitle: 'مرحبًا بعودتك', signInSub: 'سجّل الدخول لتتابع تدريبك.',
        signUpTitle: 'أنشئ حسابك', signUpSub: 'مجاني. احفظ سجل ألعابك وتقدّمك.',
        google: 'المتابعة باستخدام Google', or: 'أو',
        name: 'اسمك', email: 'البريد الإلكتروني', password: 'كلمة المرور (6 أحرف أو أكثر)',
        signIn: 'تسجيل الدخول', signUp: 'إنشاء حساب',
        toSignUp: 'جديد هنا؟ أنشئ حسابًا', toSignIn: 'لديك حساب؟ سجّل الدخول',
        forgot: 'نسيت كلمة المرور؟', resetSent: 'تفقّد بريدك للحصول على رابط إعادة التعيين.',
        needEmail: 'أدخل بريدك الإلكتروني أولًا.', working: 'لحظة…',
        note: 'يمكنك لعب جميع الألعاب دون حساب.',
        errors: {
          'auth/invalid-credential': 'البريد وكلمة المرور غير متطابقين.',
          'auth/invalid-email': 'يرجى إدخال بريد إلكتروني صحيح.',
          'auth/email-already-in-use': 'هذا البريد لديه حساب بالفعل. جرّب تسجيل الدخول.',
          'auth/weak-password': 'يرجى استخدام 6 أحرف على الأقل.',
          'auth/popup-closed-by-user': 'أُغلقت نافذة Google. حاول مرة أخرى.',
          'auth/popup-blocked': 'منع المتصفح نافذة Google. اسمح بالنوافذ المنبثقة وحاول مجددًا.',
          'auth/unauthorized-domain': 'تسجيل الدخول غير مفعّل لهذا العنوان بعد.',
          'auth/too-many-requests': 'محاولات كثيرة. يرجى الانتظار قليلًا.',
          default: 'حدث خطأ ما. يرجى المحاولة مرة أخرى.',
        },
      },
    };

    const LANG_KEY = 'speakupfearless.language';
    const params = new URLSearchParams(location.search);
    const next = (params.get('next') || '/').startsWith('/') ? (params.get('next') || '/') : '/';
    let lang = localStorage.getItem(LANG_KEY) === 'ar' ? 'ar' : 'en';
    let mode = params.get('mode') === 'signup' ? 'signup' : 'signin';
    const $ = (id) => document.getElementById(id);

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    // localStorage lets the main site read who is signed in.
    await setPersistence(auth, browserLocalPersistence);

    if (params.has('signout')) {
      await signOut(auth);
      location.replace(next);
    }

    function render() {
      const t = T[lang];
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      $('lang').textContent = t.lang;
      const up = mode === 'signup';
      $('title').textContent = up ? t.signUpTitle : t.signInTitle;
      $('subtitle').textContent = up ? t.signUpSub : t.signInSub;
      $('googleLabel').textContent = t.google;
      $('or').textContent = t.or;
      $('nameLabel').textContent = t.name;
      $('emailLabel').textContent = t.email;
      $('passwordLabel').textContent = t.password;
      $('submit').textContent = up ? t.signUp : t.signIn;
      $('switchMode').textContent = up ? t.toSignIn : t.toSignUp;
      $('forgot').textContent = t.forgot;
      $('forgot').classList.toggle('hidden', up);
      $('nameRow').classList.toggle('hidden', !up);
      $('password').autocomplete = up ? 'new-password' : 'current-password';
      $('note').textContent = t.note;
    }

    function show(text, kind) { $('msg').textContent = text; $('msg').className = 'msg ' + (kind || ''); }
    function fail(e) {
      const errs = T[lang].errors;
      show(errs[e && e.code] || errs.default, 'error');
      setBusy(false);
    }
    function setBusy(busy) {
      for (const id of ['google', 'submit']) $(id).disabled = busy;
      if (busy) show(T[lang].working);
    }
    function done() { location.replace(next); }

    $('lang').addEventListener('click', () => {
      lang = lang === 'ar' ? 'en' : 'ar';
      localStorage.setItem(LANG_KEY, lang);
      render();
    });
    $('switchMode').addEventListener('click', () => { mode = mode === 'signup' ? 'signin' : 'signup'; show(''); render(); });

    $('google').addEventListener('click', async () => {
      setBusy(true);
      try { await signInWithPopup(auth, new GoogleAuthProvider()); done(); } catch (e) { fail(e); }
    });

    $('form').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const email = $('email').value.trim();
      const password = $('password').value;
      setBusy(true);
      try {
        if (mode === 'signup') {
          const cred = await createUserWithEmailAndPassword(auth, email, password);
          const name = $('name').value.trim();
          if (name) await updateProfile(cred.user, { displayName: name });
          // Store the updated profile so the site sees the name.
          await auth.updateCurrentUser(cred.user);
        } else {
          await signInWithEmailAndPassword(auth, email, password);
        }
        done();
      } catch (e) { fail(e); }
    });

    $('forgot').addEventListener('click', async () => {
      const email = $('email').value.trim();
      if (!email) { show(T[lang].needEmail, 'error'); return; }
      try { await sendPasswordResetEmail(auth, email); show(T[lang].resetSent, 'ok'); } catch (e) { fail(e); }
    });

    render();
  </script>
</body>
</html>
