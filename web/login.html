<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F1DDBC">
  <meta name="robots" content="noindex">
  <title>Sign in | Speak Up Fearless</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <script>
    // Apply the saved theme before first paint; light is the default.
    try { if (localStorage.getItem('speakupfearless.theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (_) {}
  </script>
  <style>
    @font-face { font-family: "Montserrat"; src: url("/assets/assets/fonts/Montserrat-Variable.ttf") format("truetype"); font-weight: 100 900; font-display: swap; }
    @font-face { font-family: "Inter"; src: url("/assets/assets/fonts/Inter-Variable.ttf") format("truetype"); font-weight: 100 900; font-display: swap; }
    @font-face { font-family: "Cairo"; src: url("/assets/assets/fonts/Cairo-Variable.ttf") format("truetype"); font-weight: 200 1000; font-display: swap; }
    :root {
      --band: #F1DDBC; --page: #F8F5F1; --surface: #FFFFFF; --chip: rgba(255,255,255,.6);
      --ink: #2B2118; --text: #332A23; --muted: #6E645B; --border: #E8E0D6;
      --primary: #B4583A; --primary-pressed: #96452C; --on-primary: #FFFFFF;
      --soft: #F6E3D9; --error: #B42318; --ok: #3F7D4E; --shadow: rgba(43,33,24,.10);
    }
    :root[data-theme="dark"] {
      --band: #241C16; --page: #17120F; --surface: #221B16; --chip: rgba(255,255,255,.06);
      --ink: #F2E9DF; --text: #E6DCD1; --muted: #B3A699; --border: #3A2F27;
      --primary: #E08A68; --primary-pressed: #EFA284; --on-primary: #1A130F;
      --soft: #3A2720; --error: #F97066; --ok: #7BC08C; --shadow: rgba(0,0,0,.35);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--page); color: var(--text);
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
    }
    :root[dir="rtl"] body, :root[dir="rtl"] h1 { font-family: "Cairo", "Inter", system-ui, sans-serif; }

    header {
      background: var(--band);
      padding: calc(env(safe-area-inset-top) + 8px) 16px 8px;
      border-bottom: 1px solid var(--border);
    }
    .bar { max-width: 1080px; margin: 0 auto; height: 48px; display: flex; align-items: center; gap: 6px; }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); min-width: 0; margin-inline-end: auto; }
    .brand svg { flex: none; }
    .brand span { font-family: "Montserrat", system-ui, sans-serif; font-weight: 700; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pill, .icon-btn {
      height: 40px; border: 0; border-radius: 999px; color: var(--ink);
      font: inherit; font-weight: 600; font-size: 14px; cursor: pointer; flex: none;
      display: inline-flex; align-items: center; justify-content: center; text-decoration: none;
    }
    .pill { padding: 0 12px; gap: 4px; background: var(--chip); }
    .pill svg { width: 18px; height: 18px; }
    .icon-btn { width: 40px; background: transparent; }
    .pill:hover, .icon-btn:hover { background: var(--surface); }
    .icon-btn svg { width: 22px; height: 22px; }

    main { max-width: 440px; margin: 0 auto; padding: 32px 16px calc(env(safe-area-inset-bottom) + 48px); }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 28px 24px; box-shadow: 0 12px 32px var(--shadow); }
    .badge { width: 52px; height: 52px; border-radius: 16px; background: var(--soft); color: var(--primary); display: grid; place-items: center; margin-bottom: 16px; }
    .badge svg { width: 26px; height: 26px; }
    h1 { font-family: "Montserrat", system-ui, sans-serif; color: var(--ink); font-size: clamp(24px, 6.4vw, 28px); line-height: 1.2; margin: 0 0 6px; font-weight: 800; }
    p.sub { margin: 0 0 24px; color: var(--muted); font-size: 15px; line-height: 1.5; }

    .btn { width: 100%; min-height: 50px; border-radius: 999px; font: inherit; font-weight: 700; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: background .15s, border-color .15s; }
    .btn-google { background: var(--surface); color: var(--ink); border: 1.5px solid var(--border); }
    .btn-google:hover { border-color: var(--muted); }
    .btn-primary { background: var(--primary); color: var(--on-primary); border: 0; margin-top: 20px; }
    .btn-primary:hover { background: var(--primary-pressed); }
    .btn[disabled] { opacity: .6; cursor: wait; }
    .or { display: flex; align-items: center; gap: 12px; color: var(--muted); margin: 22px 0 6px; font-size: 13px; }
    .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--border); }

    label { display: block; color: var(--ink); font-weight: 600; font-size: 14px; margin: 16px 0 6px; }
    input { width: 100%; min-height: 50px; background: var(--page); color: var(--ink); border: 1px solid var(--border); border-radius: 14px; padding: 0 14px; font: inherit; font-size: 16px; }
    input:focus { outline: 2px solid var(--primary); outline-offset: 0; border-color: transparent; background: var(--surface); }

    .forgot-row { display: flex; justify-content: flex-end; margin-top: 8px; }
    .link { background: none; border: 0; padding: 4px 0; font: inherit; font-size: 14px; color: var(--primary); font-weight: 600; cursor: pointer; }
    .link:hover { text-decoration: underline; }
    .switch { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--border); text-align: center; color: var(--muted); font-size: 14px; }
    .msg { margin-top: 14px; font-size: 14px; min-height: 20px; text-align: center; }
    .msg:empty { min-height: 0; margin: 0; }
    .msg.error { color: var(--error); }
    .msg.ok { color: var(--ok); }
    .note { margin: 20px 8px 0; font-size: 13px; color: var(--muted); text-align: center; line-height: 1.5; }
    .hidden { display: none !important; }
    @media (max-width: 440px) {
      header { padding-left: 12px; padding-right: 8px; }
      .bar { gap: 2px; }
      .brand { gap: 8px; }
      .brand span { font-size: 16px; }
      .icon-btn { width: 36px; }
      .pill { padding: 0 10px; }
    }
    @media (max-width: 380px) { .card { padding: 24px 18px; } }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <a class="brand" href="/" aria-label="Speak Up Fearless">
        <svg width="30" height="30" viewBox="0 0 100 100" aria-hidden="true">
          <rect x="8" y="8" width="84" height="64" rx="22" fill="var(--primary)"/>
          <path d="M28 68 L22 92 L48 68 Z" fill="var(--primary)"/>
          <path d="M38 48 L50 28 L62 48 M50 28 L50 56" fill="none" stroke="var(--page)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span dir="ltr">Speak Up Fearless</span>
      </a>
      <button class="pill" id="lang" type="button"></button>
      <button class="icon-btn" id="theme" type="button"></button>
      <a class="icon-btn" id="home" href="/">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10.6 3.6a2 2 0 0 1 2.8 0l7 6.6c.4.4.6.9.6 1.4V19a2 2 0 0 1-2 2h-3.5a1 1 0 0 1-1-1v-4.5h-5V20a1 1 0 0 1-1 1H5a2 2 0 0 1-2-2v-7.4c0-.5.2-1 .6-1.4z"/></svg>
      </a>
    </div>
  </header>
  <main>
    <div class="card">
      <div class="badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      </div>
      <h1 id="title"></h1>
      <p class="sub" id="subtitle"></p>

      <button class="btn btn-google" id="google" type="button">
        <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        <span id="googleLabel"></span>
      </button>

      <div class="or" id="or"></div>

      <form id="form" novalidate>
        <div id="nameRow" class="hidden">
          <label for="name" id="nameLabel"></label>
          <input id="name" autocomplete="name">
        </div>
        <label for="email" id="emailLabel"></label>
        <input id="email" type="email" autocomplete="email" inputmode="email" autocapitalize="off" required>
        <label for="password" id="passwordLabel"></label>
        <input id="password" type="password" autocomplete="current-password" required minlength="6">
        <div class="forgot-row" id="forgotRow"><button class="link" id="forgot" type="button"></button></div>
        <button class="btn btn-primary" id="submit" type="submit"></button>
      </form>

      <div class="msg" id="msg" role="status" aria-live="polite"></div>
      <div class="switch"><span id="switchLead"></span> <button class="link" id="switchMode" type="button"></button></div>
    </div>
    <p class="note" id="note"></p>
  </main>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js';
    import {
      getAuth, setPersistence, browserLocalPersistence, GoogleAuthProvider,
      signInWithPopup, signInWithEmailAndPassword, createUserWithEmailAndPassword,
      updateProfile, sendPasswordResetEmail, signOut,
    } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js';

    // Public web config for the Speak Up Fearless Firebase project.
    const firebaseConfig = {
      apiKey: 'AIzaSyD61GC3xaetEqOwPYhYltxMp-FAsFLX6Ow',
      authDomain: 'speakup-ca500.firebaseapp.com',
      projectId: 'speakup-ca500',
      storageBucket: 'speakup-ca500.firebasestorage.app',
      messagingSenderId: '228155483447',
      appId: '1:228155483447:web:6c6ef4cc6f9454f7d8e6b2',
    };

    const T = {
      en: {
        lang: 'ع', langName: 'العربية', home: 'Back to the site', light: 'Light theme', dark: 'Dark theme',
        signInTitle: 'Welcome back', signInSub: 'Sign in to play the games and keep track of your practice.',
        signUpTitle: 'Create your free account', signUpSub: 'Unlock all our speaking games and save your progress.',
        google: 'Continue with Google', or: 'or use your email',
        name: 'Your name', email: 'Email', password: 'Password (6+ characters)',
        signIn: 'Sign in', signUp: 'Create account',
        toSignUpLead: 'New here?', toSignUp: 'Create an account',
        toSignInLead: 'Already have an account?', toSignIn: 'Sign in',
        forgot: 'Forgot password?', resetSent: 'Check your email for a reset link.',
        needEmail: 'Enter your email first.', working: 'One moment…',
        note: 'Your account is free. We only use your email to sign you in.',
        errors: {
          'auth/invalid-credential': 'That email and password don’t match.',
          'auth/invalid-email': 'Please enter a valid email.',
          'auth/email-already-in-use': 'That email already has an account. Try signing in.',
          'auth/weak-password': 'Please use at least 6 characters.',
          'auth/popup-closed-by-user': 'The Google window was closed. Try again.',
          'auth/popup-blocked': 'Your browser blocked the Google window. Allow pop-ups and try again.',
          'auth/unauthorized-domain': 'Sign-in isn’t enabled for this web address yet.',
          'auth/too-many-requests': 'Too many tries. Please wait a moment.',
          default: 'Something went wrong. Please try again.',
        },
      },
      ar: {
        lang: 'EN', langName: 'English', home: 'العودة إلى الموقع', light: 'المظهر الفاتح', dark: 'المظهر الداكن',
        signInTitle: 'مرحبًا بعودتك', signInSub: 'سجّل الدخول لتلعب الألعاب وتتابع تدريبك.',
        signUpTitle: 'أنشئ حسابك المجاني', signUpSub: 'افتح جميع ألعاب التحدث واحفظ تقدّمك.',
        google: 'المتابعة باستخدام Google', or: 'أو استخدم بريدك الإلكتروني',
        name: 'اسمك', email: 'البريد الإلكتروني', password: 'كلمة المرور (6 أحرف أو أكثر)',
        signIn: 'تسجيل الدخول', signUp: 'إنشاء حساب',
        toSignUpLead: 'جديد هنا؟', toSignUp: 'أنشئ حسابًا',
        toSignInLead: 'لديك حساب بالفعل؟', toSignIn: 'سجّل الدخول',
        forgot: 'نسيت كلمة المرور؟', resetSent: 'تفقّد بريدك للحصول على رابط إعادة التعيين.',
        needEmail: 'أدخل بريدك الإلكتروني أولًا.', working: 'لحظة…',
        note: 'حسابك مجاني. نستخدم بريدك فقط لتسجيل دخولك.',
        errors: {
          'auth/invalid-credential': 'البريد وكلمة المرور غير متطابقين.',
          'auth/invalid-email': 'يرجى إدخال بريد إلكتروني صحيح.',
          'auth/email-already-in-use': 'هذا البريد لديه حساب بالفعل. جرّب تسجيل الدخول.',
          'auth/weak-password': 'يرجى استخدام 6 أحرف على الأقل.',
          'auth/popup-closed-by-user': 'أُغلقت نافذة Google. حاول مرة أخرى.',
          'auth/popup-blocked': 'منع المتصفح نافذة Google. اسمح بالنوافذ المنبثقة وحاول مجددًا.',
          'auth/unauthorized-domain': 'تسجيل الدخول غير مفعّل لهذا العنوان بعد.',
          'auth/too-many-requests': 'محاولات كثيرة. يرجى الانتظار قليلًا.',
          default: 'حدث خطأ ما. يرجى المحاولة مرة أخرى.',
        },
      },
    };

    const LANG_KEY = 'speakupfearless.language';
    const THEME_KEY = 'speakupfearless.theme';
    const params = new URLSearchParams(location.search);
    const next = (params.get('next') || '/').startsWith('/') ? (params.get('next') || '/') : '/';
    let lang = localStorage.getItem(LANG_KEY) === 'ar' ? 'ar' : 'en';
    let mode = params.get('mode') === 'signup' ? 'signup' : 'signin';
    const $ = (id) => document.getElementById(id);

    const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
    const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
    const LANG_ICON = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m12.87 15.07-2.54-2.51.03-.03A17.5 17.5 0 0 0 14.07 6H17V4h-7V2H8v2H1v2h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2zm-2.62 7 1.62-4.33L19.12 17z"/></svg>';
    const isDark = () => document.documentElement.dataset.theme === 'dark';

    function render() {
      const t = T[lang];
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      $('lang').innerHTML = LANG_ICON + '<span></span>';
      $('lang').lastChild.textContent = t.lang;
      $('lang').title = t.langName;
      $('lang').setAttribute('aria-label', t.langName);
      $('home').title = t.home;
      $('home').setAttribute('aria-label', t.home);
      $('theme').innerHTML = isDark() ? SUN : MOON;
      $('theme').title = isDark() ? t.light : t.dark;
      $('theme').setAttribute('aria-label', $('theme').title);
      document.querySelector('meta[name="theme-color"]').content = isDark() ? '#241C16' : '#F1DDBC';
      const up = mode === 'signup';
      $('title').textContent = up ? t.signUpTitle : t.signInTitle;
      $('subtitle').textContent = up ? t.signUpSub : t.signInSub;
      $('googleLabel').textContent = t.google;
      $('or').textContent = t.or;
      $('nameLabel').textContent = t.name;
      $('emailLabel').textContent = t.email;
      $('passwordLabel').textContent = t.password;
      $('submit').textContent = up ? t.signUp : t.signIn;
      $('switchLead').textContent = up ? t.toSignInLead : t.toSignUpLead;
      $('switchMode').textContent = up ? t.toSignIn : t.toSignUp;
      $('forgot').textContent = t.forgot;
      $('forgotRow').classList.toggle('hidden', up);
      $('nameRow').classList.toggle('hidden', !up);
      $('password').autocomplete = up ? 'new-password' : 'current-password';
      $('note').textContent = t.note;
    }

    $('lang').addEventListener('click', () => {
      lang = lang === 'ar' ? 'en' : 'ar';
      localStorage.setItem(LANG_KEY, lang);
      render();
    });
    $('theme').addEventListener('click', () => {
      const dark = !isDark();
      if (dark) document.documentElement.dataset.theme = 'dark';
      else delete document.documentElement.dataset.theme;
      try { localStorage.setItem(THEME_KEY, dark ? 'dark' : 'light'); } catch (_) {}
      render();
    });
    $('switchMode').addEventListener('click', () => { mode = mode === 'signup' ? 'signin' : 'signup'; show(''); render(); });
    render();

    function show(text, kind) { $('msg').textContent = text; $('msg').className = 'msg ' + (kind || ''); }
    function fail(e) {
      const errs = T[lang].errors;
      show(errs[e && e.code] || errs.default, 'error');
      setBusy(false);
    }
    function setBusy(busy) {
      for (const id of ['google', 'submit']) $(id).disabled = busy;
      if (busy) show(T[lang].working);
    }
    function done() { location.replace(next); }

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    // localStorage lets the main site read who is signed in.
    await setPersistence(auth, browserLocalPersistence);

    if (params.has('signout')) {
      await signOut(auth);
      location.replace(next);
    }

    $('google').addEventListener('click', async () => {
      setBusy(true);
      try { await signInWithPopup(auth, new GoogleAuthProvider()); done(); } catch (e) { fail(e); }
    });

    $('form').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const email = $('email').value.trim();
      const password = $('password').value;
      setBusy(true);
      try {
        if (mode === 'signup') {
          const cred = await createUserWithEmailAndPassword(auth, email, password);
          const name = $('name').value.trim();
          if (name) await updateProfile(cred.user, { displayName: name });
          // Store the updated profile so the site sees the name.
          await auth.updateCurrentUser(cred.user);
        } else {
          await signInWithEmailAndPassword(auth, email, password);
        }
        done();
      } catch (e) { fail(e); }
    });

    $('forgot').addEventListener('click', async () => {
      const email = $('email').value.trim();
      if (!email) { show(T[lang].needEmail, 'error'); return; }
      try { await sendPasswordResetEmail(auth, email); show(T[lang].resetSent, 'ok'); } catch (e) { fail(e); }
    });
  </script>
</body>
</html>
