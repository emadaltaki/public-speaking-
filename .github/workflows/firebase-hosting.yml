# Publishes the website (build/web, already built and committed) to Firebase
# Hosting. Two sites, picked by branch:
#   main -> prod site (speakup-ca500, speakunshaken.com)
#   dev  -> dev site  (speakunshaken-dev, dev.speakunshaken.com)
# Every pull request also gets a preview link on the prod site.
# Needs the repository secret FIREBASE_SERVICE_ACCOUNT_SPEAKUP_CA500 (a service
# account key for the speakup-ca500 project).
name: Firebase Hosting

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPEAKUP_CA500 }}
          projectId: speakup-ca500
          channelId: ${{ github.event_name == 'push' && 'live' || '' }}
          target: ${{ github.event_name == 'push' && github.ref_name == 'dev' && 'dev' || 'prod' }}
