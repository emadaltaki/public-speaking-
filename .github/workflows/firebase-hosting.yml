# Publishes the website (build/web, already built and committed) to Firebase
# Hosting. Two Firebase projects, picked by branch:
#   main -> prod (speakup-ca500, speakunshaken.com)
#   dev  -> dev  (speakup-dev, dev.speakunshaken.com)
# Every pull request also gets a preview link on prod.
# Needs the repository secrets FIREBASE_SERVICE_ACCOUNT_SPEAKUP_CA500 and
# FIREBASE_SERVICE_ACCOUNT_SPEAKUP_DEV (service account keys for each project).
name: Firebase Hosting

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ github.event_name == 'push' && github.ref_name == 'dev' && secrets.FIREBASE_SERVICE_ACCOUNT_SPEAKUP_DEV || secrets.FIREBASE_SERVICE_ACCOUNT_SPEAKUP_CA500 }}
          projectId: ${{ github.event_name == 'push' && github.ref_name == 'dev' && 'speakup-dev' || 'speakup-ca500' }}
          channelId: ${{ github.event_name == 'push' && 'live' || '' }}
