<!DOCTYPE html>
<html lang="en-CA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F1DDBC">
  <title>Triple Step | Speak Up Fearless</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/game.css">
  <style>
    .ts-top { width: 100%; max-width: 760px; }
    .words { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 26px auto 0; max-width: 760px; min-height: 64px; }
    .word { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 999px; background: var(--tint); border: 1px solid var(--border); font-family: var(--head); font-weight: 800; font-size: 20px; color: var(--ink); }
    .word.new { background: var(--primary); border-color: var(--primary); color: var(--on-primary); font-size: 26px; padding: 12px 22px; animation: pop .4s cubic-bezier(.3,1.6,.5,1); box-shadow: 0 10px 24px -10px var(--primary); }
    .word.new em { font-style: normal; font-size: 11px; font-weight: 900; letter-spacing: .1em; padding: 2px 7px; border-radius: 999px; background: rgba(255,255,255,.25); }
    @keyframes pop { from { transform: scale(.5); opacity: 0; } }
    .soon { color: var(--muted); margin-top: 22px; }
    .meta { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
    .results { list-style: none; padding: 0; margin: 16px 0 0; text-align: start; }
    .results li { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid var(--border); font-size: 14.5px; }
    .results li:first-child { border-top: 0; }
    .results b { color: var(--ink); }
  </style>
  <script>try { if (localStorage.getItem('speakupfearless.theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (_) {}</script>
</head>
<body>
  <main class="wrap" id="main"></main>
  <script src="/app.js"></script>
  <script src="/game.js"></script>
  <script>
    (function () {
      var S = window.SUF, G = window.G, t = S.t, esc = S.esc;
      var ID = 'triple-step';
      var settings = { multi: false, players: [], count: 6, seconds: 60, suggest: true, survival: false, set: 'General' };

      G.boot(ID, function (games, words) {
        var namesRow;
        G.setup({
          id: ID, games: games, subtitle: t('tripleStepSetupSubtitle'),
          render: function (rows) {
            var playersBox = document.createElement('div');
            rows.appendChild(G.modeTabs({ value: settings.multi, onChange: function (v) { settings.multi = v; paintPlayers(); } }));
            rows.appendChild(playersBox);
            function paintPlayers() {
              playersBox.innerHTML = '';
              namesRow = null;
              if (!settings.multi) return;
              if (settings.players.length < 2) settings.players = [G.playerName(1), G.playerName(2)];
              namesRow = G.players({ names: settings.players, min: 2, max: 8 });
              playersBox.appendChild(namesRow);
            }
            paintPlayers();
            rows.appendChild(G.slider({ icon: G.ICON.list, label: t('tripleStepTopics'), help: t('tripleStepTopicsHelp'), min: 3, max: 10, value: settings.count,
              format: String, onChange: function (v) { settings.count = v; } }));
            rows.appendChild(G.slider({ icon: G.ICON.clock, label: t('tripleStepTimer'), min: 30, max: 300, step: 30, value: settings.seconds,
              format: G.timerLabel, onChange: function (v) { settings.seconds = v; } }));
            rows.appendChild(G.toggle({ label: t('tripleStepSuggestTitle'), help: t('tripleStepSuggestTitleHelp'), value: settings.suggest, onChange: function (v) { settings.suggest = v; } }));
            rows.appendChild(G.toggle({ label: t('tripleStepSurvival'), help: t('tripleStepSurvivalHelp'), value: settings.survival, onChange: function (v) { settings.survival = v; } }));
            rows.appendChild(G.select({ label: t('tripleStepWordSet'), value: settings.set, options: Object.keys(words.wordSets), onChange: function (v) { settings.set = v; } }));
          },
          onStart: function () {
            if (namesRow) settings.players = namesRow.names();
            game(0, []);
          }
        });

        // One turn. playerIndex counts multiplayer turns; results collects them.
        function game(playerIndex, results) {
          var player = settings.multi ? settings.players[playerIndex] : null;
          var topic = settings.suggest ? G.pickTopic(true, 'General') : t('yourOwnTopic');
          var pool = G.shuffle((words.wordSets[settings.set] || words.wordSets.General).slice());
          var total = settings.seconds * 1000;
          var interval = total / (settings.count + 1);
          var elapsed = 0, paused = false, shownCount = 0;
          var st = G.stage({});
          G.ready(st.body, {
            topic: topic,
            extra: player ? '<div style="margin-top:14px"><span class="chip strong">' + esc(t('turnOf', { n: player })) + '</span></div>' : '',
            hint: settings.survival ? t('tripleStepSurvivalInstruction') : t('tripleStepInstruction')
          }, run);

          function revealed() {
            var n = Math.floor(elapsed / interval);
            if (!settings.survival) n = Math.min(n, settings.count);
            var out = [];
            for (var i = 0; i < n; i++) out.push(pool[i % pool.length]);
            return out;
          }
          function run() {
            st.body.innerHTML = '<div class="ts-top">' + (player ? '<span class="chip strong">' + esc(t('turnOf', { n: player })) + '</span>' : '') +
              '<div class="topic-label" style="margin-top:10px">' + esc(t('conductorTopic')) + '</div><div class="topic">' + esc(topic) + '</div></div>' +
              '<div class="words" aria-live="polite"></div><div class="soon"></div>' +
              '<div style="margin-top:24px">' + G.pie(1) + '<div class="clock"></div></div>' +
              '<div class="controls"><button class="btn btn-ghost" type="button" id="pause"></button>' +
              '<button class="btn btn-primary" type="button" id="stop">' + G.ICON.flag + esc(settings.survival ? t('tripleStepStuck') : t('tripleStepFinish')) + '</button></div>';
            st.body.querySelector('#pause').addEventListener('click', function () { paused = !paused; paintPause(); });
            st.body.querySelector('#stop').addEventListener('click', function () { finish(false); });
            paintPause();
            paintWords();
            G.loop(function (d) {
              if (paused) return;
              elapsed += d;
              if (!settings.survival && elapsed >= total) { elapsed = total; return finish(true); }
              if (revealed().length !== shownCount) { paintWords(); if (navigator.vibrate) navigator.vibrate(40); }
              tick();
            });
          }
          function nextIn() {
            if (!settings.survival && revealed().length >= settings.count) return null;
            return interval - (elapsed % interval);
          }
          function tick() {
            var left, frac;
            if (settings.survival) { left = nextIn(); frac = left / interval; } else { left = total - elapsed; frac = left / total; }
            G.setPie(st.body, frac);
            st.body.querySelector('.clock').textContent = G.clock(left);
            var soon = st.body.querySelector('.soon');
            var n = nextIn();
            soon.textContent = shownCount === 0 ? t('tripleStepFirstWordSoon') : (n == null ? '' : t('tripleStepNextWordIn') + ' ' + Math.ceil(n / 1000) + (S.lang === 'ar' ? ' ث' : 's'));
          }
          function paintWords() {
            var list = revealed();
            shownCount = list.length;
            st.body.querySelector('.words').innerHTML = list.map(function (w, i) {
              var isNew = i === list.length - 1;
              return '<span class="word' + (isNew ? ' new' : '') + '">' + esc(w) + (isNew ? '<em>' + esc(t('tripleStepNew')) + '</em>' : '') + '</span>';
            }).join('');
            tick();
          }
          function paintPause() {
            var b = st.body.querySelector('#pause');
            b.innerHTML = (paused ? G.ICON.play : G.ICON.pause) + esc(paused ? t('tripleStepResume') : t('tripleStepPause'));
          }
          function finish(timeUp) {
            G.loopStop();
            var handled = revealed().length;
            S.recordRound({ gameId: ID, spokenSeconds: elapsed / 1000, topic: settings.suggest ? topic : null });
            var all = results.concat([{ player: player, topic: topic, words: handled, ms: elapsed }]);
            var more = settings.multi && playerIndex < settings.players.length - 1;
            var everyone = settings.multi && !more;
            var summary = everyone ? '<ul class="results">' + all.map(function (r) {
              return '<li><b>' + esc(r.player) + '</b><span>' + r.words + ' · ' + G.clock(r.ms) + '</span></li>';
            }).join('') + '</ul>' : '';
            G.end({
              title: everyone ? t('tripleStepEveryoneWent') : (timeUp ? t('tripleStepTimeUp') : t('tripleStepRoundEnded')),
              message: t('youSpokeFor', { n: G.clock(elapsed).replace(/^0/, '') }) + ' ' + t('tripleStepWords') + ': ' + handled + '.',
              extra: summary,
              primary: more ? t('tripleStepNextPlayer') : (settings.multi ? t('tripleStepNewGame') : t('tripleStepNextTopic')),
              onPrimary: function () { st.close(); if (more) game(playerIndex + 1, all); else game(0, []); },
              onRetry: function () { st.close(); game(playerIndex, results); },
              onSettings: function () { st.close(); }
            });
          }
        }
      });
    })();
  </script>
</body>
</html>
