      // Once picked, today's topic is remembered so it never changes mid-day.
      function myTopic(words, rounds) {
        var u = S.user(), key = 'speakupfearless.dailyTopic.' + u.uid;
        var done = rounds.filter(function (r) { return r.gameId === ID && r.topic && dayKey(new Date(r.playedAt)) === TODAY; })[0];
        if (done) return done.topic;
        try { var saved = JSON.parse(localStorage.getItem(key) || 'null'); if (saved && saved.day === TODAY) return saved.topic; } catch (_) {}
        var used = {};
        rounds.forEach(function (r) { if (r.gameId === ID && r.topic) used[r.topic] = true; });
        avoided().forEach(function (x) { used[x] = true; });
        var pool = words.topics.filter(function (x) { return !used[x]; });
        if (!pool.length) pool = words.topics.slice();
        var pick = pool[hashOf(u.uid + '|' + TODAY) % pool.length];
        try { localStorage.setItem(key, JSON.stringify({ day: TODAY, topic: pick })); } catch (_) {}
        return pick;
      }
      // Every round we know about: this device's plus the ones saved to the account.
      var known = [];
      function stats(rounds) {
        var days = {};
        rounds.forEach(function (r) { if (r.gameId === ID) days[dayKey(new Date(r.playedAt))] = true; });
        // A streak stays alive until the end of the day after the last one.
        var start = days[TODAY] ? today : addDays(today, -1);
        var cur = 0;
        while (days[dayKey(addDays(start, -cur))]) cur++;
        var keys = Object.keys(days).sort(), best = 0, run = 0, prev = null;
        keys.forEach(function (k) {
          var d = new Date(k + 'T12:00:00');
          run = prev && Math.round((d - prev) / 86400000) === 1 ? run + 1 : 1;
          best = Math.max(best, run);
          prev = d;
        });
        return { days: days, current: cur, best: best, total: keys.length, doneToday: !!days[TODAY] };
      }
      function streakLabel(n) { return n === 0 ? t('dStreak0') : n === 1 ? t('dStreak1') : t('dStreak', { n: n }); }

      // ------------------------------------------------------------ page
      var main = document.getElementById('main');
      Promise.all([S.loadGames(), G.loadWords()]).then(function (res) {
        var words = res[1];
        if (!S.user()) return teaser(words);
        // The daily challenge's own "How it works" steps.
        res[0].daily = { title: t('dTitle'), steps: [t('dHow1'), t('dHow2'), t('dHow3'), t('dHow4')], tip: t('dHowTip') };
        S.gate(main, function () {
          // Wait for the account's rounds so today's topic is never one used on another device.
          S.history().then(function (rounds) {
            known = rounds;
            render(stats(known), myTopic(words, known));
          });
        });
      });

      // Signed out: show today's topic (and who shared it) with a free sign-up
      // that comes straight back here to play.
      function teaser(words) {
        var q = new URLSearchParams(location.search);
        var n = parseInt(q.get('s'), 10) || 0, by = (q.get('by') || '').slice(0, 24);
        var theirs = (q.get('t') || '').slice(0, 120);
        var topic = theirs || words.topics[hashOf('sample|' + TODAY) % words.topics.length];
        var label = theirs ? (by ? t('dTheirTopic', { name: by }) : t('dFriendTopic')) : t('dSampleTopic');
        var from = n ? (by ? (n === 1 ? t('dFrom1', { name: by }) : t('dFrom', { name: by, n: n })) : t('dFromAnon', { n: n })) : '';
        var back = encodeURIComponent('/games/daily');
        main.innerHTML = '<div class="daily">' +
          '<section class="d-hero"><div class="d-top"><span class="d-kick">' + esc(t('dKick')) + '</span></div>' +
          (from ? '<div class="d-from"><b>🔥</b><span>' + esc(from) + '</span></div>' : '') +
          '<div class="d-label">' + esc(label) + '</div><h1 class="d-topic">' + esc(topic) + '</h1>' +
          '<p class="d-rule">' + esc(t('dOwnTopic')) + '</p>' +
          '<a class="btn d-go" href="/login?mode=signup&next=' + back + '">' + G.ICON.play + esc(t('dJoinCta')) + '</a></section>' +
          '<section class="card d-join"><h3 style="font-size:17px;margin:0">' + esc(t('dJoinTitle')) + '</h3><ul><li>' + esc(t('dJoinB1')) + '</li><li>' + esc(t('dJoinB2')) + '</li><li>' + esc(t('dJoinB3')) + '</li></ul>' +
          '<p class="alt">' + esc(t('dJoinHave')) + ' <a href="/login?next=' + back + '">' + esc(t('dJoinIn')) + '</a></p></section></div>';
      }

      // Every day they earned, newest first: date, topic, and where it sat in its streak.
      function historyHtml() {
        var byDay = {};
        known.forEach(function (r) {
          if (r.gameId !== ID) return;
          var k = dayKey(new Date(r.playedAt));
          if (!byDay[k] || new Date(r.playedAt) < new Date(byDay[k].playedAt)) byDay[k] = r;
        });
        var keys = Object.keys(byDay).sort();
        if (!keys.length) return '';
        var run = 0, prev = null, pos = {};
        keys.forEach(function (k) {
          var d = new Date(k + 'T12:00:00');
          run = prev && Math.round((d - prev) / 86400000) === 1 ? run + 1 : 1;
          pos[k] = run; prev = d;
        });
        var fmt = new Intl.DateTimeFormat(S.lang === 'ar' ? 'ar' : 'en-CA', { weekday: 'short', month: 'short', day: 'numeric' });
        var rows = keys.reverse().slice(0, 60).map(function (k, i) {
          var r = byDay[k];
          return '<li' + (i >= 7 ? ' class="more-row" hidden' : '') + '><span class="h-day"><b>' + esc(fmt.format(new Date(k + 'T12:00:00'))) + '</b><small>🔥 ' + esc(t('dDayN', { n: pos[k] })) + '</small></span>' +
            '<span class="h-topic">' + esc(r.topic || '') + '</span></li>';
        }).join('');
        return '<section class="card hist"><h3>' + esc(t('dHistory')) + '</h3><ul>' + rows + '</ul>' +
          (keys.length > 7 ? '<button class="link h-more" type="button">' + esc(t('dShowAll')) + '</button>' : '') + '</section>';
      }

      function render(st, topic) {
        var dateFmt = new Intl.DateTimeFormat(S.lang === 'ar' ? 'ar' : 'en-CA', { weekday: 'long', month: 'long', day: 'numeric' });
        var dayFmt = new Intl.DateTimeFormat(S.lang === 'ar' ? 'ar' : 'en-CA', { weekday: 'narrow' });
        var keepAlive = !st.doneToday && st.current > 0;
        var week = '';
        for (var i = 6; i >= 0; i--) {
          var d = addDays(today, -i), k = dayKey(d);
          week += '<span class="' + (st.days[k] ? 'on' : '') + (k === TODAY ? ' today' : '') + '">' + esc(dayFmt.format(d)) + '<i>' + (st.days[k] ? '🔥' : '') + '</i></span>';
        }
        main.innerHTML = '<div class="daily">' +
          '<a class="back-games" href="/games">' + BACK + esc(t('dBackGames')) + '</a>' +
          '<section class="d-hero"><div class="d-top"><span class="d-kick">' + esc(t('dKick')) + '</span><span class="d-date">' + esc(dateFmt.format(today)) + '</span></div>' +
          '<div class="d-row"><div class="streak' + (st.current ? '' : ' cold') + '"><span class="fire">🔥</span>' + esc(keepAlive ? t('dKeep', { n: st.current }) : streakLabel(st.current)) + '</div></div>' +
          '<div class="d-label">' + esc(t('dTopicLabel')) + '</div><h1 class="d-topic">' + esc(topic) + '</h1>' +
          (st.doneToday
            ? '<div class="d-done"><b>✓</b><span>' + esc(t('dDoneToday')) + '</span></div>' +
              '<div class="d-actions"><button class="btn d-go" style="margin:0" type="button" id="share">' + SHARE + esc(t('dShare')) + '</button>' +
              '<button class="btn d-ghost" type="button" id="again">' + esc(t('dAgain')) + '</button></div>'
            : '<p class="d-rule">' + esc(t('dRule')) + '</p><button class="btn d-go" type="button" id="go">' + G.ICON.play + esc(t('dStart')) + '</button>') +
          '<button class="d-how" type="button">' + G.ICON.bulb + esc(t('howTo')) + '</button>' +
          '</section>' +
          '<section class="card week"><h3>' + esc(t('dWeek')) + '</h3><div class="days">' + week + '</div>' +
          '<div class="best"><span>' + esc(t('dBest')) + ': <b>' + st.best + '</b></span><span>' + esc(t('dTotal')) + ': <b>' + st.total + '</b></span></div></section>' +
          historyHtml() +
          '<section class="card why"><h3 style="font-size:15px;margin:0">' + esc(t('dWhy')) + '</h3><ul><li>' + esc(t('dWhy1')) + '</li><li>' + esc(t('dWhy2')) + '</li><li>' + esc(t('dWhy3')) + '</li></ul></section>' +
          '</div>';
        var go = main.querySelector('#go') || main.querySelector('#again');
        // No streak yet: explain it first, and "Let's play" starts the minute.
        go.addEventListener('click', function () {
          if (go.id === 'go' && st.current === 0) S.howToPlay(ID, function () { play(topic, st); });
          else play(topic, st);
        });
        main.querySelector('.d-how').addEventListener('click', function () { S.howToPlay(ID, st.doneToday ? null : function () { play(topic, st); }); });
        var hm = main.querySelector('.h-more');
        if (hm) hm.addEventListener('click', function () { main.querySelectorAll('.hist .more-row').forEach(function (r) { r.hidden = false; }); hm.remove(); });
        var sh = main.querySelector('#share');
        if (sh) { var ready = prepare(st.current, topic); sh.addEventListener('click', function () { share(ready); }); }
      }

      // ------------------------------------------------------------ one minute
      function play(topic, before) {
        var stg = G.stage({});
        var total = SECONDS * 1000, elapsed = 0, paused = false;
        G.ready(stg.body, { topic: topic, topicLabel: t('dTopicLabel') }, function () {
          stg.body.innerHTML = '<div class="topic-label">' + esc(t('dTopicLabel')) + '</div><div class="topic">' + esc(topic) + '</div>' +
            '<div style="margin-top:28px">' + G.pie(1) + '<div class="clock">' + G.clock(total) + '</div></div>' +
            '<div class="controls"><button class="btn btn-ghost" type="button" id="pause"></button>' +
            '<button class="btn btn-primary" type="button" id="stop">' + G.ICON.flag + esc(t('dFinish')) + '</button></div>';
          var paint = function () { stg.body.querySelector('#pause').innerHTML = (paused ? G.ICON.play : G.ICON.pause) + esc(paused ? t('tripleStepResume') : t('tripleStepPause')); };
          paint();
          stg.body.querySelector('#pause').addEventListener('click', function () { paused = !paused; paint(); });
          stg.body.querySelector('#stop').addEventListener('click', function () {
            // Practice rounds can end any time; today's round needs the full minute.
            if (before.doneToday || elapsed >= total) return finish();
            paused = true; paint();
            notYet(elapsed, function () { paused = false; paint(); }, function () { G.loopStop(); stg.close(); render(stats(known), topic); });
          });
          G.loop(function (d) {
            if (paused) return;
            elapsed += d;
            if (elapsed >= total) { elapsed = total; return finish(); }
            G.setPie(stg.body, 1 - elapsed / total);
            stg.body.querySelector('.clock').textContent = G.clock(total - elapsed);
          });
        });
        function finish() {
          G.loopStop();
          var spoke = elapsed / 1000;
          var counts = elapsed >= total && !before.doneToday;
          if (counts) {
            S.recordRound({ gameId: ID, spokenSeconds: spoke, topic: topic });
            known = [{ gameId: ID, playedAt: new Date().toISOString(), spokenSeconds: Math.round(spoke), topic: topic }].concat(known);
          }
          var after = stats(known);
          var wasDone = before.doneToday;
          var n = after.current;
          var close = function () { stg.close(); render(after, topic); };
          if (counts) {
            // 1. First full minute today: celebrate and offer to share.
            var el = endCard({
              tone: 'fire', icon: '🔥', big: n, count: true, label: t('dEndStreak'), week: weekDots(after, true), embers: true,
              title: t('dWinTitle'), topic: topic, body: t('dWinBody'),
              primary: SHARE + esc(t('dShare')), secondary: [[t('dBackGames'), function () { location.href = '/games'; }], [t('close'), close]]
            });
            var ready = prepare(n, topic);
            el.querySelector('.de-primary').addEventListener('click', function () { share(ready, el.querySelector('.shared')); });
            if (navigator.vibrate) navigator.vibrate([30, 40, 60]);
          } else {
            // 2. Practice after today is already earned: show the time, keep the streak.
            var el2 = endCard({
              tone: 'calm', icon: '🎤', big: G.clock(elapsed).replace(/^00:/, '0:'), label: t('dSpoken'),
              title: t('dPracTitle'), body: n === 1 ? t('dPracBody1') : t('dPracBody', { n: n }),
              primary: SHARE + esc(n === 1 ? t('dShare') : t('dShareN', { n: n })), secondary: [[t('dAgain'), function () { el2.remove(); stg.close(); play(topic, stats(known)); }], [t('close'), close]]
            });
            var ready2 = prepare(n, topic);
            el2.querySelector('.de-primary').addEventListener('click', function () { share(ready2, el2.querySelector('.shared')); });
          }
        }
      }

      function weekDots(st, lightToday) {
        var dayFmt = new Intl.DateTimeFormat(S.lang === 'ar' ? 'ar' : 'en-CA', { weekday: 'narrow' });
        var week = '';
        for (var i = 6; i >= 0; i--) {
          var d = addDays(today, -i), k = dayKey(d), on = !!st.days[k];
          week += '<span class="' + (on ? 'on' : '') + (k === TODAY && on && lightToday ? ' now' : '') + '"><i>' + (on ? '🔥' : '') + '</i>' + esc(dayFmt.format(d)) + '</span>';
        }
        return week;
      }

      // One clean card for every ending: a coloured top with one big number,
      // a short message, one main button and up to two small links.
      function endCard(o) {
        var embers = '';
        if (o.embers) for (var e = 0; e < 14; e++) embers += '<span class="ember" style="left:' + (8 + Math.random() * 84).toFixed(1) + '%;animation-delay:' + (Math.random() * 2.8).toFixed(2) + 's;animation-duration:' + (2.2 + Math.random() * 1.6).toFixed(2) + 's"></span>';
        var el = document.createElement('div');
        el.className = 'end d-end';
        el.innerHTML = '<div class="card"><div class="de-top ' + o.tone + '">' + embers + '<div class="de-flame">' + o.icon + '</div>' +
          '<div class="de-count">' + (o.count ? '0' : esc(String(o.big))) + '</div><div class="de-label">' + esc(o.label) + '</div>' +
          (o.week ? '<div class="de-week">' + o.week + '</div>' : '') + '</div>' +
          '<div class="de-body"><h2>' + esc(o.title) + '</h2>' +
          (o.topic ? '<div class="de-topic">💬 ' + esc(o.topic) + '</div>' : '') +
          '<p>' + esc(o.body) + '</p>' +
          '<button class="btn btn-primary de-primary" type="button">' + o.primary + '</button>' +
          '<div class="shared" hidden></div>' +
          '<div class="more">' + (o.secondary || []).map(function (x, i) { return '<button type="button" data-i="' + i + '">' + esc(x[0]) + '</button>'; }).join('') + '</div></div></div>';
        document.body.appendChild(el);
        el.querySelectorAll('.more button').forEach(function (btn) {
          btn.addEventListener('click', function () { el.remove(); o.secondary[+btn.dataset.i][1](); });
        });
        if (o.count) {
          var cnt = el.querySelector('.de-count'), n = +o.big, step = 0, steps = Math.min(n, 20);
          if (!steps) cnt.textContent = n;
          else var tk = setInterval(function () { step++; cnt.textContent = Math.round(n * step / steps); if (step >= steps) { clearInterval(tk); cnt.textContent = n; } }, 45);
        }
        return el;
      }

      // 3. "I'm done" before the first full minute today: it won't count yet.
      function notYet(ms, onKeep, onLeave) {
        var left = Math.max(1, Math.ceil((SECONDS * 1000 - ms) / 1000));
        var el = endCard({
          tone: 'calm', icon: '⏳', big: t('dLeft', { n: left }), label: t('dLeftLabel'),
          title: t('dNotYet'), body: t('dNotYetBody'),
          primary: G.ICON.play + esc(t('dKeepGoing')), secondary: [[t('dLeave'), onLeave]]
        });
        el.querySelector('.de-primary').addEventListener('click', function () { el.remove(); onKeep(); });
      }

      // ------------------------------------------------------------ share card
      function card(n, topic) {
        var c = document.createElement('canvas');
        c.width = 1080; c.height = 1350;
        var x = c.getContext('2d');
        var g = x.createLinearGradient(0, 0, 1080, 1350);
        g.addColorStop(0, '#E0703E'); g.addColorStop(.7, '#A23B1E'); g.addColorStop(1, '#7A2A16');
        x.fillStyle = g; x.fillRect(0, 0, 1080, 1350);
        x.fillStyle = 'rgba(255,255,255,.08)';
        x.beginPath(); x.arc(940, 160, 300, 0, Math.PI * 2); x.fill();
        x.beginPath(); x.arc(120, 1300, 220, 0, Math.PI * 2); x.fill();
        x.fillStyle = '#fff'; x.textAlign = 'center';
        var head = S.lang === 'ar' ? '800 {s}px Cairo, sans-serif' : '800 {s}px Montserrat, sans-serif';
        var body = S.lang === 'ar' ? '600 {s}px Cairo, sans-serif' : '600 {s}px Inter, sans-serif';
        var f = function (tpl, size) { return tpl.replace('{s}', size); };
        x.font = f(body, 40); x.globalAlpha = .9; x.fillText('SPEAK UP FEARLESS', 540, 150); x.globalAlpha = 1;
        x.font = '220px serif'; x.fillText('🔥', 540, 470);
        x.font = f(head, 200); x.fillText(String(n), 540, 700);
        x.font = f(head, 60); x.fillText(t('dEndStreak'), 540, 790);
        x.font = f(body, 38); x.globalAlpha = .85; x.fillText(t('dKick'), 540, 930); x.globalAlpha = 1;
        // Wrap the topic over up to three lines.
        x.font = f(head, 64);
        var wordsOf = String(topic).split(' '), lines = [], line = '';
        wordsOf.forEach(function (w) { var test = line ? line + ' ' + w : w; if (x.measureText(test).width > 900 && line) { lines.push(line); line = w; } else line = test; });
        if (line) lines.push(line);
        lines.slice(0, 3).forEach(function (l, i) { x.fillText(l, 540, 1020 + i * 78); });
        x.font = f(body, 34); x.globalAlpha = .85; x.fillText(SITE.replace('https://', '') + '/games/daily', 540, 1290);
        return c;
      }
      // The link brings friends to this page with the streak and first name,
      // so signed-out visitors see who shared it and can join from there.
      function prepare(n, topic) {
        var u = S.user();
        var url = SITE + '/games/daily?s=' + n + (u && u.shortName ? '&by=' + encodeURIComponent(u.shortName) : '') + '&t=' + encodeURIComponent(topic);
        var p = { text: n > 1 ? t('dShareText', { n: n, topic: topic }) : t('dShareText1', { topic: topic }), url: url };
        return p;
      }
      // Share a link (not a picture) so friends land on the challenge page.
      // The chat app shows the page's own preview title and photo.
      function share(p, msgEl) {
        var say = function (m) { if (msgEl) { msgEl.hidden = false; msgEl.textContent = m; } else S.toast(m); };
        if (navigator.share) {
          navigator.share({ title: t('dTitle'), text: p.text, url: p.url }).catch(function () {});
          return;
        }
        var copied = function () { say(t('dLinkCopied')); };
        if (navigator.clipboard) navigator.clipboard.writeText(p.text + ' ' + p.url).then(copied, function () { window.prompt('', p.url); });
        else window.prompt('', p.url);
      }

    })();
  </script>
</body>
</html>
