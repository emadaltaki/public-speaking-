<!DOCTYPE html>
<html lang="en-CA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F1DDBC">
  <meta name="robots" content="noindex">
  <title>Your account | Speak Up Fearless</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/app.css">
  <style>
    .banner { display: flex; align-items: center; gap: 16px; padding: 22px; border-radius: 28px; color: #fff; background: linear-gradient(135deg, #C8643F, #8E3B22); box-shadow: 0 14px 28px -16px rgba(142,59,34,.6); }
    .photo { position: relative; width: 72px; height: 72px; flex: none; padding: 0; border: 0; border-radius: 50%; background: none; cursor: pointer; }
    .photo .av { width: 72px; height: 72px; font-size: 28px; background-color: rgba(255,255,255,.18); box-shadow: 0 0 0 2.5px #fff; }
    .photo .cam { position: absolute; right: -2px; bottom: -2px; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: #fff; color: #8E3B22; box-shadow: 0 2px 6px rgba(0,0,0,.2); }
    :root[dir="rtl"] .photo .cam { right: auto; left: -2px; }
    .photo .cam svg { width: 16px; height: 16px; }
    .photo.busy .av { opacity: .5; }
    .banner h1 { color: #fff; font-size: 23px; font-weight: 800; }
    .banner .mail { color: rgba(255,255,255,.88); font-size: 14.5px; overflow-wrap: anywhere; }
    .banner .rm { background: none; border: 0; padding: 4px 0 0; color: #fff; font-weight: 600; font-size: 14px; text-decoration: underline; cursor: pointer; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .stat { text-align: center; }
    .stat b { display: block; font-family: var(--head); font-size: 34px; font-weight: 800; color: var(--accent); line-height: 1.2; }
    .stat span { color: var(--muted); font-size: 14px; }
    .list { list-style: none; margin: 10px 0 0; padding: 0; }
    .list li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border); }
    .list li:first-child { border-top: 0; }
    .list .gi { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; color: #fff; flex: none; }
    .list .gi svg { width: 18px; height: 18px; }
    .list .t { flex: 1; min-width: 0; }
    .list .t b { display: block; color: var(--ink); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .list .t small { color: var(--muted); font-size: 13px; }
    .list .r { color: var(--muted); font-size: 14px; white-space: nowrap; }
    .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
    .tile { display: flex; flex-direction: column; justify-content: space-between; min-height: 112px; padding: 14px; border-radius: 20px; color: #fff; text-decoration: none; font-weight: 700; }
    .tile .g-ic { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: rgba(255,255,255,.2); }
    .tile .g-ic svg { width: 20px; height: 20px; }
    .book { display: flex; align-items: center; gap: 14px; }
    .book .t { flex: 1; }
    .book b { display: block; color: var(--ink); }
    .book small { color: var(--muted); }
    .book .btn { min-height: 42px; padding: 0 18px; }
    .out { display: flex; justify-content: center; }
    .out button { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; color: var(--muted); font-weight: 600; cursor: pointer; padding: 8px 12px; border-radius: 999px; }
    .out button:hover { background: var(--soft); }
    .out svg { width: 18px; height: 18px; }
    h2 { font-size: 20px; }
  </style>
  <script>try { if (localStorage.getItem('speakupfearless.theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (_) {}</script>
</head>
<body>
  <main class="wrap narrow stack" id="main"></main>

  <script src="/app.js"></script>
  <script>
    (function () {
      var S = window.SUF;
      S.addStrings({
        title: 'Your account', outTitle: 'Save your progress', outBody: 'Sign in to play the games and keep a history of every round.',
        hello: 'Hi, {n} 👋', remove: 'Remove photo', add: 'Add a photo', saved: 'Your photo is saved.', local: "Saved on this device. We'll sync it to your account soon.",
        roundsLabel: 'Rounds played', time: 'Speaking time', byGame: 'By game', recent: 'Recent rounds',
        first: 'Play your first game', none: 'Your rounds and speaking time will show up here.',
        bookTitle: 'Ready to practice live?', bookBody: 'Book a free 15 minute intro call.', book: 'Book', signOut: 'Sign out', create: 'Create account'
      }, {
        title: 'حسابك', outTitle: 'احفظ تقدّمك', outBody: 'سجّل الدخول لتلعب الألعاب وتحتفظ بسجل كل جولة.',
        hello: 'مرحبًا يا {n} 👋', remove: 'احذف الصورة', add: 'أضف صورة', saved: 'تم حفظ صورتك.', local: 'حُفظت على هذا الجهاز، وسنحفظها في حسابك قريبًا.',
        roundsLabel: 'الجولات', time: 'وقت الحديث', byGame: 'حسب اللعبة', recent: 'آخر الجولات',
        first: 'العب أول لعبة لك', none: 'ستظهر هنا جولاتك ووقت حديثك.',
        bookTitle: 'مستعد للتدرّب مباشرة؟', bookBody: 'احجز مكالمة تعريفية مجانية لمدة 15 دقيقة.', book: 'احجز', signOut: 'تسجيل الخروج', create: 'إنشاء حساب'
      });
      document.title = S.t('title') + ' | Speak Up Fearless';
      var main = document.getElementById('main');
      var u = S.user();
      var esc = S.esc;
      var CAM = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 3 7.2 5H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.2L15 3zm3 14a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>';
      var INSIGHT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/></svg>';
      var CAL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18M9 15l2 2 4-4"/></svg>';
      var OUT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4M15 8l4 4-4 4M19 12H9"/></svg>';

      if (!u) {
        main.innerHTML = '<div class="card center"><div class="ic round">' + INSIGHT + '</div><h2>' + esc(S.t('outTitle')) + '</h2>' +
          '<p class="lead" style="margin:8px auto 0">' + esc(S.t('outBody')) + '</p>' +
          '<div class="btn-row" style="margin-top:20px"><a class="btn btn-primary" href="/login?next=%2Faccount">' + esc(S.t('signIn')) + '</a>' +
          '<a class="btn btn-ghost" href="/login?mode=signup&next=%2Faccount">' + esc(S.t('create')) + '</a></div></div>';
        return;
      }

      main.innerHTML =
        '<section class="banner"><button class="photo" type="button" id="photo" aria-label="' + esc(S.t('add')) + '"><span class="av"></span><span class="cam">' + CAM + '</span></button>' +
        '<div style="min-width:0"><h1>' + esc(S.t('hello', { n: u.shortName })) + '</h1><div class="mail">' + esc(u.email) + '</div>' +
        '<button class="rm" type="button" id="remove" hidden>' + esc(S.t('remove')) + '</button></div></section>' +
        '<div id="history"></div>' +
        '<div class="card book"><span class="ic">' + CAL + '</span><span class="t"><b>' + esc(S.t('bookTitle')) + '</b><small>' + esc(S.t('bookBody')) + '</small></span>' +
        '<a class="btn btn-primary" href="/#book">' + esc(S.t('book')) + '</a></div>' +
        '<div class="out"><button type="button" id="signout">' + OUT + esc(S.t('signOut')) + '</button></div>';

      // Profile photo: tapping it opens the phone's own picker straight away.
      var photoBtn = document.getElementById('photo');
      var av = photoBtn.querySelector('.av');
      function showPhoto(v) {
        S.avatarStyle(av, u, v);
        document.getElementById('remove').hidden = !v;
      }
      showPhoto(S.cachedAvatar());
      S.onAvatar(showPhoto);
      S.refreshAvatar();
      function save(p) {
        photoBtn.classList.add('busy');
        return S.saveAvatar(p).then(function (ok) {
          photoBtn.classList.remove('busy');
          S.toast(ok ? S.t('saved') : S.t('local'));
        });
      }
      photoBtn.addEventListener('click', function () {
        S.pickPhoto().then(function (p) { if (p) save(p); });
      });
      document.getElementById('remove').addEventListener('click', function () { save(null); });
      document.getElementById('signout').addEventListener('click', S.signOut);

      // Rounds and speaking time.
      var box = document.getElementById('history');
      function minutes(sec) { var m = Math.round(sec / 60); return S.t('minutes', { n: m < 1 && sec > 0 ? 1 : m }); }
      Promise.all([S.loadGames(), S.history()]).then(function (res) {
        var games = res[0], rounds = res[1];
        if (!rounds.length) {
          box.innerHTML = '<div class="card"><h2>' + esc(S.t('first')) + '</h2><p class="lead" style="font-size:15px;margin-top:4px">' + esc(S.t('none')) + '</p>' +
            '<div class="tiles">' + S.ORDER.map(function (id) {
              return '<a class="tile g-' + id + '" href="/games/' + id + '"><span class="g-ic">' + S.ICONS[id] + '</span><span>' + esc(games[id].title) + '</span></a>';
            }).join('') + '</div></div>';
          return;
        }
        var total = rounds.reduce(function (s, r) { return s + (r.spokenSeconds || 0); }, 0);
        var by = {};
        rounds.forEach(function (r) { (by[r.gameId] = by[r.gameId] || []).push(r); });
        var fmt = new Intl.DateTimeFormat(S.lang === 'ar' ? 'ar' : 'en-CA', { month: 'short', day: 'numeric', year: 'numeric' });
        var gi = function (id) { return '<span class="gi g-' + id + '">' + (S.ICONS[id] || '') + '</span>'; };
        var title = function (id) { return games[id] ? games[id].title : id; };
        box.innerHTML =
          '<div class="stats"><div class="card stat"><b>' + rounds.length + '</b><span>' + esc(S.t('roundsLabel')) + '</span></div>' +
          '<div class="card stat"><b>' + esc(minutes(total)) + '</b><span>' + esc(S.t('time')) + '</span></div></div>' +
          '<div class="card" style="margin-top:16px"><h2>' + esc(S.t('byGame')) + '</h2><ul class="list">' + Object.keys(by).map(function (id) {
            var list = by[id];
            var n = list.length;
            return '<li>' + gi(id) + '<span class="t"><b>' + esc(title(id)) + '</b></span><span class="r">' +
              esc(n === 1 ? S.t('round1') : S.t('rounds', { n: n })) + ' · ' + esc(minutes(list.reduce(function (s, r) { return s + r.spokenSeconds; }, 0))) + '</span></li>';
          }).join('') + '</ul></div>' +
          '<div class="card" style="margin-top:16px"><h2>' + esc(S.t('recent')) + '</h2><ul class="list">' + rounds.slice(0, 10).map(function (r) {
            return '<li>' + gi(r.gameId) + '<span class="t"><b>' + esc(r.topic || title(r.gameId)) + '</b><small>' + esc(title(r.gameId)) + ' · ' + esc(fmt.format(new Date(r.playedAt))) + '</small></span>' +
              '<span class="r">' + esc(minutes(r.spokenSeconds)) + '</span></li>';
          }).join('') + '</ul></div>';
      });
    })();
  </script>
</body>
</html>
