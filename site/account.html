<!DOCTYPE html>
<html lang="en-CA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F1DDBC">
  <meta name="robots" content="noindex">
  <title>Your account | Speak Up Fearless</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/app.css">
  <style>
    .banner { display: flex; align-items: center; gap: 16px; padding: 22px; border-radius: 28px; color: #fff; background: linear-gradient(135deg, #C8643F, #8E3B22); box-shadow: 0 14px 28px -16px rgba(142,59,34,.6); }
    .photo { position: relative; width: 72px; height: 72px; flex: none; padding: 0; border: 0; border-radius: 50%; background: none; cursor: pointer; }
    .photo .av { width: 72px; height: 72px; font-size: 28px; background-color: rgba(255,255,255,.18); box-shadow: 0 0 0 2.5px #fff; }
    .photo .cam { position: absolute; right: -2px; bottom: -2px; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: #fff; color: #8E3B22; box-shadow: 0 2px 6px rgba(0,0,0,.2); }
    :root[dir="rtl"] .photo .cam { right: auto; left: -2px; }
    .photo .cam svg { width: 16px; height: 16px; }
    .photo.busy .av { opacity: .5; }
    .banner h1 { color: #fff; font-size: 23px; font-weight: 800; }
    .banner .mail { color: rgba(255,255,255,.88); font-size: 14.5px; overflow-wrap: anywhere; }
    .banner .rm { background: none; border: 0; padding: 4px 0 0; color: #fff; font-weight: 600; font-size: 14px; text-decoration: underline; cursor: pointer; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .stat { text-align: center; }
    .stat b { display: block; font-family: var(--head); font-size: 34px; font-weight: 800; color: var(--accent); line-height: 1.2; }
    .stat span { color: var(--muted); font-size: 14px; }
    .list { list-style: none; margin: 10px 0 0; padding: 0; }
    .list li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border); }
    .list li:first-child { border-top: 0; }
    .list .gi { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; color: #fff; flex: none; }
    .list .gi svg { width: 18px; height: 18px; }
    .list .t { flex: 1; min-width: 0; }
    .list .t b { display: block; color: var(--ink); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .list .t small { color: var(--muted); font-size: 13px; }
    .list .r { color: var(--muted); font-size: 14px; white-space: nowrap; }
    .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
    .tile { display: flex; flex-direction: column; justify-content: space-between; min-height: 112px; padding: 14px; border-radius: 20px; color: #fff; text-decoration: none; font-weight: 700; }
    .tile .g-ic { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: rgba(255,255,255,.2); }
    .tile .g-ic svg { width: 20px; height: 20px; }
    .book { display: flex; align-items: center; gap: 14px; }
    .book .t { flex: 1; }
    .book b { display: block; color: var(--ink); }
    .book small { color: var(--muted); }
    .book .btn { min-height: 42px; padding: 0 18px; }
    .out { display: flex; justify-content: center; }
    .out button { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; color: var(--muted); font-weight: 600; cursor: pointer; padding: 8px 12px; border-radius: 999px; }
    .out button:hover { background: var(--soft); }
    .out svg { width: 18px; height: 18px; }
    h2 { font-size: 20px; }
    /* Streak */
    .streak-card { display: flex; align-items: center; gap: 16px; padding: 20px; border-radius: 26px; color: #fff; text-decoration: none; background: linear-gradient(145deg, #E0703E, #A23B1E 70%, #7A2A16); box-shadow: 0 16px 30px -18px rgba(122,42,22,.7); }
    .streak-card .fl { font-size: 46px; line-height: 1; }
    .streak-card.cold .fl { filter: grayscale(1); opacity: .7; }
    .streak-card .t { flex: 1; min-width: 0; }
    .streak-card b { display: block; font-family: var(--head); font-size: 24px; line-height: 1.15; }
    .streak-card small { display: block; margin-top: 4px; opacity: .9; font-size: 14px; }
    .streak-card .go { flex: none; white-space: nowrap; padding: 9px 14px; border-radius: 999px; background: #fff; color: #A23B1E; font-weight: 800; font-size: 14px; }
    @media (max-width: 520px) { .streak-card { flex-wrap: wrap; } .streak-card .go { flex-basis: 100%; text-align: center; padding: 11px; } }
    /* Numbers */
    .stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .stats3 .stat { padding: 16px 8px; }
    .stats3 .stat b { font-size: 24px; }
    .stats3 .stat span { display: block; font-size: 12.5px; line-height: 1.3; margin-top: 2px; }
    /* Games */
    .games-list li .play { flex: none; padding: 7px 14px; border-radius: 999px; background: var(--soft); color: var(--accent); font-weight: 700; font-size: 13.5px; text-decoration: none; }
    .games-list .t small { display: block; }
    /* Activity */
    .day-h { margin: 14px 0 0; padding-top: 12px; border-top: 1px solid var(--border); color: var(--muted); font-size: 12.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    .day-h:first-of-type { margin-top: 8px; padding-top: 0; border-top: 0; }
    .act li { border-top: 0; padding: 8px 0; }
    .act .t small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .more-act { margin-top: 8px; }
    .g-daily { background: linear-gradient(145deg, #E0703E, #A23B1E 70%, #7A2A16); }
  </style>
  <script>try { if (localStorage.getItem('speakupfearless.theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (_) {}</script>
</head>
<body>
  <main class="wrap narrow stack" id="main"></main>

  <script src="/app.js"></script>
  <script>
    (function () {
      var S = window.SUF;
      S.addStrings({
        title: 'Your account', outTitle: 'Save your progress', outBody: 'Sign in to play the games and keep a history of every round.',
        hello: 'Hi, {n} 👋', remove: 'Remove photo', add: 'Add a photo', saved: 'Your photo is saved.', local: "Saved on this device. We'll sync it to your account soon.",
        roundsLabel: 'Rounds played', time: 'Speaking time', byGame: 'By game', recent: 'Recent rounds',
        aStreak: '{n}-day streak', aStreak1: '1-day streak', aStreak0: 'No streak yet',
        aDoneToday: "Today's challenge is done. Best streak: {b}", aKeep: 'Do today\'s challenge to keep it going', aStart: 'Speak for one minute today to start one',
        aGo: 'Today\'s challenge', aSpoke: 'Time spoken', aDays: 'Days practiced', aRounds: 'Rounds',
        aGames: 'Your games', aNever: 'Not played yet', aLast: 'last {d}', aPlay: 'Play',
        aActivity: 'Your activity', aToday: 'Today', aYesterday: 'Yesterday', aShowMore: 'Show older activity',
        aRoundsN: '{n} rounds', aRound1: '1 round', aPractice: 'Practice round',
        first: 'Play your first game', none: 'Your rounds and speaking time will show up here.',
        bookTitle: 'Ready to practice live?', bookBody: 'Book a free 15 minute intro call.', book: 'Book', signOut: 'Sign out', create: 'Create account'
      }, {
        title: 'حسابك', outTitle: 'احفظ تقدّمك', outBody: 'سجّل الدخول لتلعب الألعاب وتحتفظ بسجل كل جولة.',
        hello: 'مرحبًا يا {n} 👋', remove: 'احذف الصورة', add: 'أضف صورة', saved: 'تم حفظ صورتك.', local: 'حُفظت على هذا الجهاز، وسنحفظها في حسابك قريبًا.',
        roundsLabel: 'الجولات', time: 'وقت الحديث', byGame: 'حسب اللعبة', recent: 'آخر الجولات',
        aStreak: 'سلسلة {n} أيام', aStreak1: 'سلسلة يوم واحد', aStreak0: 'لا توجد سلسلة بعد',
        aDoneToday: 'أنجزت تحدي اليوم. أفضل سلسلة: {b}', aKeep: 'أنجز تحدي اليوم لتستمر', aStart: 'تحدّث دقيقة اليوم لتبدأ سلسلة',
        aGo: 'تحدي اليوم', aSpoke: 'وقت الحديث', aDays: 'أيام التدريب', aRounds: 'الجولات',
        aGames: 'ألعابك', aNever: 'لم تلعبها بعد', aLast: 'آخر مرة {d}', aPlay: 'العب',
        aActivity: 'نشاطك', aToday: 'اليوم', aYesterday: 'أمس', aShowMore: 'اعرض النشاط الأقدم',
        aRoundsN: '{n} جولات', aRound1: 'جولة واحدة', aPractice: 'جولة تدريب',
        first: 'العب أول لعبة لك', none: 'ستظهر هنا جولاتك ووقت حديثك.',
        bookTitle: 'مستعد للتدرّب مباشرة؟', bookBody: 'احجز مكالمة تعريفية مجانية لمدة 15 دقيقة.', book: 'احجز', signOut: 'تسجيل الخروج', create: 'إنشاء حساب'
      });
      document.title = S.t('title') + ' | Speak Up Fearless';
      var main = document.getElementById('main');
      var u = S.user();
      var esc = S.esc;
      var CAM = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 3 7.2 5H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.2L15 3zm3 14a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>';
      var INSIGHT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/></svg>';
      var CAL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18M9 15l2 2 4-4"/></svg>';
      var OUT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4M15 8l4 4-4 4M19 12H9"/></svg>';

      if (!u) {
        main.innerHTML = '<div class="card center"><div class="ic round">' + INSIGHT + '</div><h2>' + esc(S.t('outTitle')) + '</h2>' +
          '<p class="lead" style="margin:8px auto 0">' + esc(S.t('outBody')) + '</p>' +
          '<div class="btn-row" style="margin-top:20px"><a class="btn btn-primary" href="/login?next=%2Faccount">' + esc(S.t('signIn')) + '</a>' +
          '<a class="btn btn-ghost" href="/login?mode=signup&next=%2Faccount">' + esc(S.t('create')) + '</a></div></div>';
        return;
      }

      main.innerHTML =
        '<section class="banner"><button class="photo" type="button" id="photo" aria-label="' + esc(S.t('add')) + '"><span class="av"></span><span class="cam">' + CAM + '</span></button>' +
        '<div style="min-width:0"><h1>' + esc(S.t('hello', { n: u.shortName })) + '</h1><div class="mail">' + esc(u.email) + '</div>' +
        '<button class="rm" type="button" id="remove" hidden>' + esc(S.t('remove')) + '</button></div></section>' +
        '<div id="history"></div>' +
        '<div class="card book"><span class="ic">' + CAL + '</span><span class="t"><b>' + esc(S.t('bookTitle')) + '</b><small>' + esc(S.t('bookBody')) + '</small></span>' +
        '<a class="btn btn-primary" href="/#book">' + esc(S.t('book')) + '</a></div>' +
        '<div class="out"><button type="button" id="signout">' + OUT + esc(S.t('signOut')) + '</button></div>';

      // Profile photo: tapping it opens the phone's own picker straight away.
      var photoBtn = document.getElementById('photo');
      var av = photoBtn.querySelector('.av');
      function showPhoto(v) {
        S.avatarStyle(av, u, v);
        document.getElementById('remove').hidden = !v;
      }
      showPhoto(S.cachedAvatar());
      S.onAvatar(showPhoto);
      S.refreshAvatar();
      function save(p) {
        photoBtn.classList.add('busy');
        return S.saveAvatar(p).then(function (ok) {
          photoBtn.classList.remove('busy');
          S.toast(ok ? S.t('saved') : S.t('local'));
        });
      }
      photoBtn.addEventListener('click', function () {
        S.pickPhoto().then(function (p) { if (p) save(p); });
      });
      document.getElementById('remove').addEventListener('click', function () { save(null); });
      document.getElementById('signout').addEventListener('click', S.signOut);

      // ------------------------------------------------------------ progress
      // Streak first, then three honest totals, every game, and a day-by-day log.
      var box = document.getElementById('history');
      var dayKey = function (d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
      var addDays = function (d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; };
      var now = new Date(), TODAY = dayKey(now), YDAY = dayKey(addDays(now, -1));
      // 45s, 2m 05s, 1h 12m
      function dur(sec) {
        sec = Math.round(sec || 0);
        if (sec < 60) return sec + (S.lang === 'ar' ? ' ث' : 's');
        var h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), x = sec % 60;
        if (S.lang === 'ar') return h ? h + ' س ' + m + ' د' : m + ' د ' + (x ? x + ' ث' : '');
        return h ? h + 'h ' + m + 'm' : m + 'm' + (x ? ' ' + String(x).padStart(2, '0') + 's' : '');
      }
      function streakOf(rounds) {
        var days = {};
        rounds.forEach(function (r) { if (r.gameId === 'daily') days[dayKey(new Date(r.playedAt))] = true; });
        var start = days[TODAY] ? now : addDays(now, -1), cur = 0;
        while (days[dayKey(addDays(start, -cur))]) cur++;
        var keys = Object.keys(days).sort(), best = 0, run = 0, prev = null;
        keys.forEach(function (k) { var d = new Date(k + 'T12:00:00'); run = prev && Math.round((d - prev) / 86400000) === 1 ? run + 1 : 1; best = Math.max(best, run); prev = d; });
        return { cur: cur, best: best, today: !!days[TODAY] };
      }
      var FIRE = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.5 2s1 3.3-1.5 6C9.1 10 7 11.6 7 14.8A5 5 0 0 0 12 20a5 5 0 0 0 5-5c0-1.8-.7-3.2-1.5-4.2 0 0-.1 1.9-1.8 2.4 0 0 1-4.8-1.2-11.2z"/></svg>';
      Promise.all([S.loadGames(), S.history()]).then(function (res) {
        var games = res[0], rounds = res[1];
        var ids = ['daily'].concat(S.ORDER);
        var title = function (id) { return id === 'daily' ? S.t('dailyName') : games[id] ? games[id].title : id; };
        var icon = function (id) { return id === 'daily' ? FIRE : (S.ICONS[id] || ''); };
        var gi = function (id) { return '<span class="gi g-' + id + '">' + icon(id) + '</span>'; };
        var dateFmt = new Intl.DateTimeFormat(S.lang === 'ar' ? 'ar' : 'en-CA', { weekday: 'short', month: 'short', day: 'numeric' });
        var timeFmt = new Intl.DateTimeFormat(S.lang === 'ar' ? 'ar' : 'en-CA', { hour: 'numeric', minute: '2-digit' });
        var dayName = function (k) { return k === TODAY ? S.t('aToday') : k === YDAY ? S.t('aYesterday') : dateFmt.format(new Date(k + 'T12:00:00')); };

        // Streak card
        var st = streakOf(rounds);
        var head = st.cur === 0 ? S.t('aStreak0') : st.cur === 1 ? S.t('aStreak1') : S.t('aStreak', { n: st.cur });
        var sub = st.today ? S.t('aDoneToday', { b: st.best }) : st.cur ? S.t('aKeep') : S.t('aStart');
        var html = '<a class="streak-card' + (st.cur ? '' : ' cold') + '" href="/games/daily"><span class="fl">🔥</span><span class="t"><b>' + esc(head) + '</b><small>' + esc(sub) + '</small></span>' +
          (st.today ? '' : '<span class="go">' + esc(S.t('aGo')) + '</span>') + '</a>';

        // Totals
        var total = rounds.reduce(function (s, r) { return s + (r.spokenSeconds || 0); }, 0);
        var days = {};
        rounds.forEach(function (r) { days[dayKey(new Date(r.playedAt))] = true; });
        html += '<div class="stats3" style="margin-top:16px"><div class="card stat"><b>' + esc(dur(total)) + '</b><span>' + esc(S.t('aSpoke')) + '</span></div>' +
          '<div class="card stat"><b>' + Object.keys(days).length + '</b><span>' + esc(S.t('aDays')) + '</span></div>' +
          '<div class="card stat"><b>' + rounds.length + '</b><span>' + esc(S.t('aRounds')) + '</span></div></div>';

        // Every game, played or not
        html += '<div class="card" style="margin-top:16px"><h2>' + esc(S.t('aGames')) + '</h2><ul class="list games-list">' + ids.map(function (id) {
          var list = rounds.filter(function (r) { return r.gameId === id; });
          var info;
          if (!list.length) info = S.t('aNever');
          else {
            var secs = list.reduce(function (s, r) { return s + (r.spokenSeconds || 0); }, 0);
            var last = dayName(dayKey(new Date(list[0].playedAt)));
            info = (list.length === 1 ? S.t('aRound1') : S.t('aRoundsN', { n: list.length })) + ' · ' + dur(secs) + ' · ' + S.t('aLast', { d: last.toLowerCase ? (last === S.t('aToday') || last === S.t('aYesterday') ? last.toLowerCase() : last) : last });
          }
          return '<li>' + gi(id) + '<span class="t"><b>' + esc(title(id)) + '</b><small>' + esc(info) + '</small></span>' +
            '<a class="play" href="/games/' + id + '">' + esc(S.t('aPlay')) + '</a></li>';
        }).join('') + '</ul></div>';

        // Activity, grouped by day
        if (rounds.length) {
          var groups = [], seen = {};
          rounds.forEach(function (r) {
            var k = dayKey(new Date(r.playedAt));
            if (!seen[k]) { seen[k] = { key: k, items: [] }; groups.push(seen[k]); }
            seen[k].items.push(r);
          });
          // The first full daily round of a day earned it; later ones were practice.
          var firstDaily = {};
          rounds.slice().reverse().forEach(function (r) { var k = dayKey(new Date(r.playedAt)); if (r.gameId === 'daily' && !firstDaily[k]) firstDaily[k] = r; });
          html += '<div class="card act" style="margin-top:16px"><h2>' + esc(S.t('aActivity')) + '</h2>' + groups.map(function (g, gi2) {
            return '<div class="day-group"' + (gi2 >= 5 ? ' hidden' : '') + '><div class="day-h">' + esc(dayName(g.key)) + ' · ' + esc(dur(g.items.reduce(function (s, r) { return s + (r.spokenSeconds || 0); }, 0))) + '</div><ul class="list">' +
              g.items.map(function (r) {
                var extra = r.gameId === 'daily' && firstDaily[g.key] !== r ? S.t('aPractice') : '';
                var line = [timeFmt.format(new Date(r.playedAt)), r.topic || '', extra].filter(Boolean).join(' · ');
                return '<li>' + gi(r.gameId) + '<span class="t"><b>' + esc(title(r.gameId)) + '</b><small>' + esc(line) + '</small></span><span class="r">' + esc(dur(r.spokenSeconds)) + '</span></li>';
              }).join('') + '</ul></div>';
          }).join('') + (groups.length > 5 ? '<button class="link more-act" type="button">' + esc(S.t('aShowMore')) + '</button>' : '') + '</div>';
        }
        box.innerHTML = html;
        var more = box.querySelector('.more-act');
        if (more) more.addEventListener('click', function () { box.querySelectorAll('.day-group[hidden]').forEach(function (d) { d.hidden = false; }); more.remove(); });
      });
    })();
  </script>
</body>
</html>
