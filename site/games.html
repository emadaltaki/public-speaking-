<!DOCTYPE html>
<html lang="en-CA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F1DDBC">
  <title>Speaking Games | Speak Up Fearless</title>
  <meta name="description" content="Quick, free speaking games to build confidence: Triple Step, The Conductor, The Podcast Game and Autocomplete.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/app.css">
  <style>
    .hub-head { padding: 12px 6px 22px; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .game { position: relative; display: flex; flex-direction: column; min-height: 250px; padding: 22px; border-radius: 24px; color: #fff; overflow: hidden; isolation: isolate; box-shadow: 0 16px 28px -18px rgba(0,0,0,.55); }
    .game::after { content: ""; position: absolute; z-index: -1; right: -40px; top: -40px; width: 170px; height: 170px; border-radius: 50%; background: rgba(255,255,255,.12); }
    :root[dir="rtl"] .game::after { right: auto; left: -40px; }
    .g-ic { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; background: rgba(255,255,255,.2); }
    .g-ic svg { width: 26px; height: 26px; }
    .game h2 { color: #fff; font-size: 22px; margin: 16px 0 6px; }
    .game p { margin: 0; color: rgba(255,255,255,.9); font-size: 15px; }
    .skills { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 0; padding: 0; list-style: none; }
    .skills li { padding: 3px 10px; border-radius: 999px; background: rgba(255,255,255,.18); font-size: 12.5px; font-weight: 600; }
    .actions { display: flex; align-items: center; gap: 8px; margin-top: auto; padding-top: 18px; }
    .play { display: inline-flex; align-items: center; gap: 6px; padding: 10px 20px; border-radius: 999px; background: #fff; color: #2B2118; font-weight: 800; text-decoration: none; }
    .play svg { width: 14px; height: 14px; }
    .how { display: inline-flex; align-items: center; gap: 6px; padding: 10px 14px; border: 0; border-radius: 999px; background: rgba(255,255,255,.16); color: #fff; font-weight: 700; cursor: pointer; }
    .how svg { width: 16px; height: 16px; }
    .daily-card { position: relative; display: flex; align-items: center; gap: 14px; margin-bottom: 16px; padding: 18px 20px; border-radius: 24px; color: #fff; text-decoration: none; overflow: hidden; isolation: isolate; box-shadow: 0 16px 28px -18px rgba(122,42,22,.7); }
    .daily-card::after { content: ""; position: absolute; z-index: -1; right: -40px; top: -60px; width: 180px; height: 180px; border-radius: 50%; background: rgba(255,255,255,.1); }
    .daily-card .g-ic svg { width: 28px; height: 28px; color: #fff; }
    .daily-card .txt { flex: 1; min-width: 0; }
    .daily-card small { display: block; font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; opacity: .85; }
    .daily-card b { display: block; font-family: var(--head); font-size: 19px; line-height: 1.25; margin-top: 2px; }
    .daily-card .st { display: inline-flex; align-items: center; gap: 4px; margin-top: 6px; padding: 3px 10px; border-radius: 999px; background: rgba(255,255,255,.18); font-size: 13px; font-weight: 700; }
    .daily-card .go { flex: none; padding: 10px 16px; border-radius: 999px; background: #fff; color: #A23B1E; font-weight: 800; font-size: 14px; }
    @media (max-width: 520px) { .daily-card .go { display: none; } }
    .soon { display: flex; align-items: center; gap: 14px; margin-top: 16px; padding: 18px 20px; border: 1.5px dashed var(--border); border-radius: 20px; color: var(--muted); }
    .soon b { display: block; color: var(--ink); }
    @media (max-width: 720px) {
      .grid { grid-template-columns: 1fr; gap: 12px; }
      .game { min-height: 0; padding: 18px; }
      .game h2 { font-size: 20px; margin-top: 12px; }
    }

    /* Playful game cards: floating icon, shine on hover, pop and ripple on tap */
    .game { cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    .game::before { content: ""; position: absolute; z-index: 1; inset: 0; pointer-events: none; background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.35) 48%, transparent 66%); transform: translateX(-120%); }
    .game:hover::before, .game.tapped::before { animation: gShine .7s ease; }
    @keyframes gShine { to { transform: translateX(120%); } }
    .game .g-ic { animation: gFloat 3.2s ease-in-out infinite; }
    .game:nth-child(2) .g-ic { animation-delay: -.8s; }
    .game:nth-child(3) .g-ic { animation-delay: -1.6s; }
    .game:nth-child(4) .g-ic { animation-delay: -2.4s; }
    @keyframes gFloat { 50% { transform: translateY(-5px) rotate(-4deg); } }
    .game.tapped { animation: gPop .42s cubic-bezier(.3,1.5,.5,1); }
    @keyframes gPop { 30% { transform: scale(.94); } 70% { transform: scale(1.04); } }
    .game.tapped .g-ic { animation: gSpin .5s cubic-bezier(.3,1.6,.5,1); }
    @keyframes gSpin { 40% { transform: scale(1.35) rotate(-14deg); } 100% { transform: none; } }
    .g-ripple { position: absolute; z-index: 0; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; background: rgba(255,255,255,.45); pointer-events: none; animation: gRipple .6s ease-out forwards; }
    @keyframes gRipple { to { transform: scale(26); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .game .g-ic, .game.tapped, .game.tapped .g-ic, .game:hover::before, .game.tapped::before, .g-ripple { animation: none !important; } }
  </style>
  <script>try { if (localStorage.getItem('speakupfearless.theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (_) {}</script>
</head>
<body>
  <main class="wrap" id="main">
    <div class="hub-head">
      <span class="eyebrow" id="eyebrow">Practice anywhere</span>
      <h1 class="page-title" id="title">Speaking Games</h1>
      <p class="lead" id="intro">Quick games to build speaking confidence, on your own or with friends.</p>
    </div>
    <div id="content"></div>
  </main>

  <script src="/app.js"></script>
  <script>
    (function () {
      var S = window.SUF;
      S.addStrings(
        { eyebrow: 'Practice anywhere', title: 'Speaking Games', intro: 'Quick games to build speaking confidence, on your own or with friends.', soonTitle: 'More games soon', soonBody: 'New ways to practice are on the way.' },
        { eyebrow: 'تدرّب في أي مكان', title: 'ألعاب الخطابة', intro: 'ألعاب سريعة لبناء الثقة في التحدث، وحدك أو مع أصدقائك.', soonTitle: 'ألعاب أخرى قريبًا', soonBody: 'طرق جديدة للتدرّب في الطريق.' }
      );
      ['eyebrow', 'title', 'intro'].forEach(function (id) { document.getElementById(id).textContent = S.t(id); });
      document.title = S.t('title') + ' | Speak Up Fearless';
      var BULB = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg>';
      var ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>';

      // A little bounce, shine and ripple when a game is tapped, then carry on.
      function gameTap(card, e, then) {
        var r = card.getBoundingClientRect();
        var dot = document.createElement('span');
        dot.className = 'g-ripple';
        dot.style.left = ((e.clientX || r.left + r.width / 2) - r.left) + 'px';
        dot.style.top = ((e.clientY || r.top + r.height / 2) - r.top) + 'px';
        card.appendChild(dot);
        setTimeout(function () { dot.remove(); }, 650);
        card.classList.remove('tapped'); void card.offsetWidth; card.classList.add('tapped');
        var calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
        setTimeout(then, calm ? 0 : 280);
      }
      var content = document.getElementById('content');
      // Today's daily challenge, with the streak from this device's rounds.
      function dailyCard() {
        var key = function (d) { return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
        var days = {};
        S.localHistory().forEach(function (r) { if (r.gameId === 'daily') days[key(new Date(r.playedAt))] = true; });
        var d = new Date(), done = !!days[key(d)], n = 0;
        if (!done) d.setDate(d.getDate() - 1);
        while (days[key(d)]) { n++; d.setDate(d.getDate() - 1); }
        return '<a class="daily-card g-daily" href="/games/daily"><span class="g-ic">' + S.ICONS.daily + '</span><span class="txt"><small>' + S.esc(S.t('dailyName')) + '</small>' +
          '<b>' + S.esc(done ? S.t('dailyCardDone') : S.t('dailyCardTitle')) + '</b>' +
          (n ? '<span class="st">🔥 ' + n + '</span>' : '') + '</span><span class="go">' + S.esc(S.t('dailyCardGo')) + '</span></a>';
      }
      S.gate(content, function () {
        return S.loadGames().then(function (games) {
          content.innerHTML = S.guestBar() + dailyCard() + '<div class="grid">' + S.ORDER.map(function (id) {
            var g = games[id];
            return '<article class="game g-' + id + '"><span class="g-ic">' + S.ICONS[id] + '</span>' +
              '<h2>' + S.esc(g.title) + '</h2><p>' + S.esc(g.tagline) + '</p>' +
              '<ul class="skills">' + g.skills.map(function (k) { return '<li>' + S.esc(k) + '</li>'; }).join('') + '</ul>' +
              '<div class="actions"><a class="play" href="/games/' + id + '">' + S.esc(S.t('play')) + ARROW + '</a>' +
              '<button class="how" type="button" data-how="' + id + '">' + BULB + S.esc(S.t('howTo')) + '</button></div></article>';
          }).join('') + '</div>' +
          '<div class="soon"><span class="ic">' + BULB + '</span><span><b>' + S.esc(S.t('soonTitle')) + '</b>' + S.esc(S.t('soonBody')) + '</span></div>';
          // The whole card plays the game, with a bounce first.
          content.querySelectorAll('.game').forEach(function (card) {
            card.addEventListener('click', function (e) {
              if (e.target.closest('[data-how]')) return;
              e.preventDefault();
              var href = card.querySelector('.play').getAttribute('href');
              gameTap(card, e, function () { location.href = href; });
            });
          });
          content.querySelectorAll('[data-how]').forEach(function (b) {
            b.addEventListener('click', function () {
              var id = b.dataset.how;
              S.howToPlay(id, function () { location.href = '/games/' + id; });
            });
          });
        });
      });
    })();
  </script>
</body>
</html>
